<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>نمودار بازار | Evren Nexus</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;min-height:100%;background:#fff;font-family:Tahoma,Arial,sans-serif}
#market-chart-page{width:100%;height:calc(100vh - 144px);margin-top:144px;position:relative;background:#fff}
#tradingview-chart{width:100%;height:100%}
#market-chart-error{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#b4232e;font-size:13px;display:none}
@media(max-width:700px){
#market-chart-page{height:calc(100vh - 133px);margin-top:133px}
#tradingview-chart{height:100%}
}
@media(max-width:430px){
#market-chart-page{height:calc(100vh - 128px);margin-top:128px}
}
.Evrenxus-page-footer{width:100%;padding:12px;text-align:center;font:9px Tahoma,Arial,sans-serif;color:#777;border-top:1px solid #e5e7e9;background:#fff} </style>
</head>
<body>
<script src="https://evrenexus.github.io/svgevrenexus-header-v5.js"></script>
<div id="market-chart-page">
<div id="tradingview-chart"></div>
<div id="market-chart-error"></div><footer class="Evrenxus-page-footer">© اورین نکسوس</footer>
</div>
<script>
(function(){
var p=new URLSearchParams(location.search),
symbol=p.get("symbol"),
error=document.getElementById("market-chart-error");
if(!symbol){
error.textContent="نماد بازار مشخص نشده است.";
error.style.display="block";
return;
}
var container=document.getElementById("tradingview-chart");
var s=document.createElement("script");
s.src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js";
s.async=true;
s.innerHTML=JSON.stringify({
"autosize":true,
"symbol":symbol,
"interval":"D",
"timezone":"Asia/Tehran",
"theme":"light",
"style":"1",
"locale":"en",
"allow_symbol_change":true,
"hide_top_toolbar":false,
"hide_legend":false,
"save_image":false,
"calendar":false,
"support_host":"https://www.tradingview.com"
});
container.appendChild(s);
})();
</script>
</body>
</html>
