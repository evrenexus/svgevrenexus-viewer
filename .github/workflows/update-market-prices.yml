name: Update Evren Nexus Market Prices

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch TGJU prices
        run: node market-data/fetch-prices.js

      - name: Commit changed prices
        run: |
          if git diff --quiet -- market-data/prices.json; then
            echo "No price change."
            exit 0
          fi
          git config user.name "Evren Nexus Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-data/prices.json
          git commit -m "Update TGJU market prices"
          git push
