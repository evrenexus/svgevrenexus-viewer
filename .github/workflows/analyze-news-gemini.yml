name: Analyze News with Gemini

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze news with Gemini
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run AI analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/news_ai.py

      - name: Commit AI database
        run: |
          git config user.name "evrenexus-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/news-ai.json

          if git diff --cached --quiet; then
            echo "No AI data changes."
            exit 0
          fi

          git commit -m "Update AI news analysis"

          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi

            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done

          echo "Push failed after retries"
          exit 1
