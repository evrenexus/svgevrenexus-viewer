name: Evren Nexus — AI Manager (Gemini → Groq → OpenRouter failover)

on:
  schedule:
    - cron: '0 */2 * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/news_ai.py'
      - '.github/workflows/analyze-news-gemini.yml'
      - 'data/automation.json'
  workflow_call:
    secrets:
      GEMINI_API_KEY:
        required: false
      GROQ_API_KEY:
        required: false
      OPENROUTER_API_KEY:
        required: false
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze:
    name: Analyze news with Gemini, Groq, then OpenRouter
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Check automation pause flag
        id: automation
        run: |
          python3 - <<'PY'
          import json, os
          try:
              with open('data/automation.json', encoding='utf-8') as f: state=json.load(f)
          except FileNotFoundError:
              state={'paused': False}
          paused='true' if state.get('paused') is True else 'false'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f: f.write('paused='+paused+ '\n')
          print('Automatic AI classification paused:', paused)
          PY
      - name: Run AI analysis
        if: steps.automation.outputs.paused != 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          EVRENEXUS_FORCE_AI: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
        run: python3 scripts/news_ai.py

      - name: Commit AI database
        if: steps.automation.outputs.paused != 'true'
        run: |
          git config user.name "evrenexus-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # news_ai.py writes both files. Commit both together so
          # no generated editorial changes remain unstaged during rebase.
          git fetch origin main
          paused=$(git show origin/main:data/automation.json | python3 -c 'import json,sys; print("true" if json.load(sys.stdin).get("paused") is True else "false")')
          if [ "$paused" = "true" ]; then
            git reset --hard origin/main
            echo "Automatic processing was paused during AI analysis; refusing to commit AI changes."
            exit 0
          fi

          git add data/news-ai.json data/editorial.json data/articles.json
          if [ -d assets/articles ]; then git add assets/articles/; fi

          if git diff --cached --quiet; then
            echo "No AI data changes."
            exit 0
          fi

          git commit -m "Update AI news analysis"

          for i in 1 2 3 4 5; do
            git fetch origin main
            paused=$(git show origin/main:data/automation.json | python3 -c 'import json,sys; print("true" if json.load(sys.stdin).get("paused") is True else "false")')
            if [ "$paused" = "true" ]; then
              git reset --hard origin/main
              echo "Automatic processing was paused before push; discarding local AI changes."
              exit 0
            fi

            if git rebase origin/main && git push origin HEAD:main; then
              echo "Push succeeded on attempt $i"
              exit 0
            fi

            git rebase --abort 2>/dev/null || true

            # Keep the working tree clean before the next attempt.
            git reset --hard HEAD
            sleep $((i * 5))
          done

          echo "Push failed after retries"
          exit 1
