name: Build public data

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  build:
    if: ${{ false }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate and build editorial data
        run: |
          python3 scripts/build_public.py
          node scripts/build-latest-news.mjs
          node scripts/validate-latest-news.mjs

      - name: Commit
        run: |
          git config user.name "evrenexus-build-bot"
          git config user.email "evrenexus-build-bot@users.noreply.github.com"
          git add data/public articles
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "build: public data"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "push failed"; exit 1
