name: Build public data

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
    - 'data/news.json'
    - 'data/editorial.json'
    - 'scripts/build_important_posts.py'
    - 'scripts/build-important-pages.mjs'
    - 'scripts/build-featured.mjs'
    - '.github/workflows/build-public.yml'
permissions:
  contents: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Validate and build editorial data
        run: python3 scripts/build_public.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Build permanent article pages and important sections
        run: node scripts/build-featured.mjs

      - name: Validate important sections
        run: node scripts/validate-featured.mjs

      - name: Build sidebar and slider selection
        run: python3 scripts/build_important_posts.py

      - name: Commit
        run: |
          git config user.name "evrenexus-build-bot"
          git config user.email "evrenexus-build-bot@users.noreply.github.com"
          git add data/public articles
          if git diff --cached --quiet; then echo "No changes"; exit 0; fi
          git commit -m "build: public data"
          for i in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((i * 5))
          done
          echo "push failed"; exit 1
