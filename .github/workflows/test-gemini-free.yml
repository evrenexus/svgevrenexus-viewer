name: Test Gemini Free AI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Diagnose Gemini API
    runs-on: ubuntu-latest

    steps:
      - name: Probe Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          echo "key length: ${#GEMINI_API_KEY}"

          B="https://generativelanguage.googleapis.com/v1beta"

          probe() {
            echo
            echo "--- $1"
            shift
            curl -sS -o /tmp/out -w "HTTP %{http_code}\n" "$@" || true
            head -c 1200 /tmp/out
            echo
          }

          probe "list (header)"             -H "x-goog-api-key: $GEMINI_API_KEY"             "$B/models"

          probe "list (query)"             "$B/models?key=$GEMINI_API_KEY"

          probe "generate gemini-2.5-flash"             -X POST             -H "x-goog-api-key: $GEMINI_API_KEY"             -H "Content-Type: application/json"             -d '{"contents":[{"parts":[{"text":"Reply with OK"}]}]}'             "$B/models/gemini-2.5-flash:generateContent"
