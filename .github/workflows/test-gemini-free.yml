name: Test Gemini Free AI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Gemini API Access
    runs-on: ubuntu-latest

    steps:
      - name: Call Gemini
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret is not configured."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api_key = os.environ["GEMINI_API_KEY"]
          url = "https://generativelanguage.googleapis.com/v1beta/models"

          req = urllib.request.Request(
              url,
              headers={"x-goog-api-key": api_key},
              method="GET",
          )

          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as e:
              print("Gemini models.list HTTP error:", e.code)
              print(e.read().decode("utf-8", "replace")[:4000])
              raise

          models = data.get("models", [])
          print(f"Gemini returned {len(models)} models.")

          for item in models:
              name = item.get("name", "")
              methods = item.get("supportedGenerationMethods", [])
              if "generateContent" in methods:
                  print(f"AVAILABLE: {name}")

          target = "models/gemini-3.5-flash-lite"
          if not any(item.get("name") == target and "generateContent" in item.get("supportedGenerationMethods", []) for item in models):
              print(f"TARGET NOT AVAILABLE: {target}")
              raise SystemExit(2)

          print(f"TARGET AVAILABLE: {target}")
          PY
