name: Test Gemini Free AI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: List Gemini models available to API key
    runs-on: ubuntu-latest

    steps:
      - name: List available Gemini models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          if [ -z "$GEMINI_API_KEY" ]; then
            echo "GEMINI_API_KEY secret is not configured."
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          api_key = os.environ["GEMINI_API_KEY"]

          url = "https://generativelanguage.googleapis.com/v1beta/models"
          req = urllib.request.Request(
              url,
              headers={
                  "Content-Type": "application/json",
                  "x-goog-api-key": api_key,
              },
              method="GET",
          )

          try:
              with urllib.request.urlopen(req, timeout=60) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as e:
              print("Gemini ListModels HTTP error:", e.code)
              print(e.read().decode("utf-8", "replace")[:4000])
              raise

          print("Models available to this API key:")
          found = False

          for model in data.get("models", []):
              actions = model.get("supportedGenerationMethods", [])
              if "generateContent" in actions:
                  print(model.get("name", ""))
                  found = True

          if not found:
              print("No model supporting generateContent was returned.")
          PY