name: Test Gemini Free AI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test Gemini 3.8 Flash
    runs-on: ubuntu-latest

    steps:
      - name: Test Gemini 3.8 Flash
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          set -e

          B="https://generativelanguage.googleapis.com/v1beta"
          URL="$B/models/gemini-3.8-flash:generateContent"

          echo "Testing Gemini 3.8 Flash..."

          curl -sS -X POST \
            -H "x-goog-api-key: $GEMINI_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{"contents":[{"parts":[{"text":"Reply with exactly: OK"}]}]}' \
            "$URL" > /tmp/out

          python - <<'PY'
          import json
          with open("/tmp/out", encoding="utf-8") as f:
              data=json.load(f)

          if "error" in data:
              print("GEMINI ERROR:")
              print(json.dumps(data["error"], ensure_ascii=False, indent=2))
              raise SystemExit(1)

          text=""
          for c in data.get("candidates", []):
              for p in c.get("content", {}).get("parts", []):
                  if "text" in p:
                      text += p["text"]

          print("GEMINI RESPONSE:", text.strip())
          if not text.strip():
              raise SystemExit("Gemini returned no text")
          PY
