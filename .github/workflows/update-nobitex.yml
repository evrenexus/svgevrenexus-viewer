# Market data workflow — keep schedule active
name: Update Nobitex Crypto Data

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "market-data/fetch-nobitex.js"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save cheerio@1.0.0-rc.12
      - run: node market-data/fetch-nobitex.js
      - name: Commit Nobitex data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-data/nobitex.json
          git diff --cached --quiet || git commit -m "Update Nobitex crypto data"
          git pull --rebase origin main
          git push
