name: Test Gemini News AI

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gemini-news-ai
  cancel-in-progress: false

jobs:
  analyze:
    name: Analyze news with Gemini
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Run AI analysis
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python3 scripts/news_ai.py

      - name: Commit AI database
        run: |
          git config user.name "evrenexus-ai-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news-ai.json
          if git diff --cached --quiet; then
            echo "No AI data changes."
            exit 0
          fi
          git commit -m "Update AI news analysis"

          for attempt in 1 2 3; do
            git fetch origin main
            git reset --soft origin/main
            git add data/news-ai.json
            if git diff --cached --quiet; then
              echo "No AI data changes after refresh."
              exit 0
            fi
            git commit -m "Update AI news analysis"
            if git push origin HEAD:main; then
              echo "Push succeeded on attempt $attempt."
              exit 0
            fi
            git reset --hard origin/main
            python3 scripts/news_ai.py
            git add data/news-ai.json
            git diff --cached --quiet && exit 0
            git commit -m "Update AI news analysis"
            sleep 3
          done

          echo "Could not push AI data after 3 attempts."
          exit 1
