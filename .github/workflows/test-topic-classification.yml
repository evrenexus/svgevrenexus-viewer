name: Topic Classification Regression Tests

on:
  push:
    branches: ["**"]
    paths:
      - "scripts/news_collector.py"
      - "scripts/test_topic_classification.py"
      - ".github/workflows/test-topic-classification.yml"
  pull_request:
    paths:
      - "scripts/news_collector.py"
      - "scripts/test_topic_classification.py"
      - ".github/workflows/test-topic-classification.yml"

permissions:
  contents: read

jobs:
  topic-classification:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Test topic classification
        run: python3 scripts/test_topic_classification.py
