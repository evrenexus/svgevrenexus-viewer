name: Audit data (read-only)

on:
  workflow_dispatch:
  push:
    paths:
      - "data/news.json"
      - "data/news-ai.json"
      - "data/editorial.json"
      - "data/articles.json"
      - "scripts/audit-data.mjs"
      - "scripts/audit-potential.mjs"
      - ".github/workflows/audit-data.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print real data shapes and counts
        run: node scripts/audit-data.mjs
      - name: Potential featured if articles were generated
        run: node scripts/audit-potential.mjs
