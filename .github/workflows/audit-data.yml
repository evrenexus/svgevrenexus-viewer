name: Audit data (read-only)

on:
  workflow_dispatch:
  push:
    paths:
      - "data/news.json"
      - "data/news-ai.json"
      - "data/editorial.json"
      - "data/articles.json"
      - "scripts/audit-data.mjs"
      - "scripts/audit-potential.mjs"
      - "scripts/build-internal-articles.mjs"
      - "scripts/featured-lib.mjs"
      - "scripts/build-featured.mjs"
      - "scripts/validate-featured.mjs"
      - ".github/workflows/audit-data.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print real data shapes and counts
        run: node scripts/audit-data.mjs
      - name: Potential featured if articles were generated
        run: node scripts/audit-potential.mjs
      - name: Build permanent articles on current data
        run: node scripts/build-internal-articles.mjs
      - name: Build featured on current data
        run: node scripts/build-featured.mjs
      - name: Validate current featured and articles
        run: node scripts/validate-featured.mjs