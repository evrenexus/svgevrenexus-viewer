name: Refresh important posts

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-important-posts
  cancel-in-progress: false

jobs:
  refresh:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build the rolling important-post selection
        run: python scripts/build_important_posts.py
      - name: Commit selection if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/important-posts.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Refresh rolling important posts"
            git push
          fi
