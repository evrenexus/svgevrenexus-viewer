name: Evren Nexus — Update domestic car prices

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/fetch-car-prices.py"
      - "car-prices.html"
      - ".github/workflows/update-car-prices.yml"

permissions:
  contents: write

concurrency:
  group: car-prices
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch IranJib prices
        run: python3 scripts/fetch-car-prices.py

      - name: Commit changed price data
        run: |
          git config user.name "evrenexus-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add car-data/car-prices.json
          if git diff --cached --quiet; then
            echo "No price changes."
            exit 0
          fi
          git commit -m "Update domestic car prices"
          git push origin HEAD:main
