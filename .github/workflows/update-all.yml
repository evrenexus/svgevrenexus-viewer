name: Evren Nexus — Update All

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update-data:
    name: Collect news
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Collect news
        run: python3 scripts/news_collector.py
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install market-data dependency
        run: npm install --no-save cheerio@1.0.0-rc.12
      - name: Update TGJU
        run: node market-data/fetch-tgju.js
      - name: Update Nobitex
        run: node market-data/fetch-nobitex.js
      - name: Commit collected news
        run: |
          git config user.name "evrenexus-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/news.json market-data/tgju.json market-data/nobitex.json
          if git diff --cached --quiet; then echo "No news changes."; exit 0; fi
          git commit -m "Update collected news"
          git push origin HEAD:main

  ai-analysis:
    name: AI analysis (non-blocking)
    needs: update-data
    uses: ./.github/workflows/analyze-news-gemini.yml
    secrets:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}

  deploy:
    name: Build and deploy
    needs: [update-data, ai-analysis]
    if: ${{ always() && needs.update-data.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Build public data
        run: python3 scripts/build_public.py
      - name: Install image-check dependency
        run: npm install --no-save cheerio@1.0.0-rc.12
      - name: Check images
        run: node scripts/check-images.mjs
      - name: Build permanent internal articles
        run: node scripts/build-internal-articles.mjs
      - name: Commit generated articles and image health
        run: |
          git config user.name "evrenexus-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json data/public/image-health.json
          if git diff --cached --quiet; then echo "No generated article/image-health changes."; exit 0; fi
          git commit -m "Build permanent articles and image health"
          git push origin HEAD:main
      - name: Build featured
        run: node scripts/build-featured.mjs
      - name: Validate featured
        run: node scripts/validate-featured.mjs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
