name: Evren Nexus — Update All

on:
  workflow_dispatch:
    if: ${{ false }}

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # Versioned group lets the fixed publication pipeline start despite an older stuck run.
  group: ${{ github.workflow }}-${{ github.ref }}-publish-v2
  cancel-in-progress: false

jobs:
  update-data:
    if: ${{ false }}
    name: Collect news
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Check automation pause flag
        id: automation
        run: |
          python3 - <<'PY'
          import json, os
          try:
              with open('data/automation.json', encoding='utf-8') as f: state=json.load(f)
          except FileNotFoundError:
              state={'paused': False}
          paused='true' if state.get('paused') is True else 'false'
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f: f.write('paused='+paused+ '\n')
          print('Automatic news processing paused:', paused)
          PY
      - name: Test topic classification
        if: steps.automation.outputs.paused != 'true'
        run: python3 scripts/test_topic_classification.py
      - name: Collect news
        if: steps.automation.outputs.paused != 'true'
        run: python3 scripts/news_collector.py
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install market-data dependency
        run: npm install --no-save cheerio@1.0.0-rc.12
      - name: Update TGJU
        run: node market-data/fetch-tgju.js
      - name: Update Nobitex
        run: node market-data/fetch-nobitex.js
      - name: Commit collected news
        run: |
          set -e
          git config user.name "evrenexus-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Other scheduled workflows may update main at the same time.
          # If a push loses that race, refresh from main and regenerate the
          # data before retrying so concurrent market-data updates are kept.
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            paused=$(git show origin/main:data/automation.json | python3 -c 'import json,sys; print("true" if json.load(sys.stdin).get("paused") is True else "false")')
            if [ "$paused" = "true" ] || [ "${{ steps.automation.outputs.paused }}" = "true" ]; then
              echo "News automation is paused; keeping collected news unchanged while allowing market-data updates."
              git checkout origin/main -- data/news.json
              git add market-data/tgju.json market-data/nobitex.json
            else
              git add data/news.json market-data/tgju.json market-data/nobitex.json
            fi
            if git diff --cached --quiet; then
              echo "No news or market-data changes."
              exit 0
            fi

            git commit -m "Update collected news"
            if git push origin HEAD:main; then
              echo "Collected news and market data committed successfully."
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Push failed after 5 attempts."
              exit 1
            fi

            echo "Push race detected; refreshing main and regenerating data (attempt $attempt/5)."
            git fetch origin main
            git reset --hard origin/main
            paused=$(git show origin/main:data/automation.json | python3 -c 'import json,sys; print("true" if json.load(sys.stdin).get("paused") is True else "false")')
            if [ "$paused" != "true" ] && [ "${{ steps.automation.outputs.paused }}" != "true" ]; then
              python3 scripts/news_collector.py
            else
              echo "Skipping news recollection while automation is paused."
            fi
            node market-data/fetch-tgju.js
            node market-data/fetch-nobitex.js
            sleep $((attempt * 3))
          done

  # Publish collected news as soon as collection succeeds; this workflow does not run AI analysis.
  deploy:
    if: ${{ false }}
    name: Build and deploy
    needs: [update-data]
    if: ${{ false }}
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Clear previous editorial selections once
        run: python3 scripts/reset-editorial-selections.py
      # This feed is generated and validated from data/news.json only, before the separate AI/editorial boxes are built.
      - name: Build independent latest-news feed
        run: node scripts/build-latest-news.mjs
      - name: Validate independent latest-news feed
        run: node scripts/validate-latest-news.mjs
      - name: Build public data for separate site features
        id: build_public_data
        continue-on-error: true
        run: python3 scripts/build_public.py
      - name: Restore public data if separate public-data build fails
        if: steps.build_public_data.outcome == 'failure'
        run: git checkout -- data/public/news.json data/public/editorial.json data/public/policy-terms.json data/public/meta.json
      - name: Install image-check dependency
        id: install_image_check
        if: steps.build_public_data.outcome == 'success'
        continue-on-error: true
        run: npm install --no-save cheerio@1.0.0-rc.12
      - name: Check images for separate site features
        id: check_images
        if: steps.build_public_data.outcome == 'success' && steps.install_image_check.outcome == 'success'
        continue-on-error: true
        run: node scripts/check-images.mjs
      - name: Restore image health if image check fails
        if: steps.check_images.outcome == 'failure'
        run: git checkout -- data/public/image-health.json
      # Keep editorial selections intact while pruning stale or invalid regular-news entries.
      - name: Synchronize regular featured items
        run: node scripts/build-featured.mjs
      # Commit the independent public/latest feeds before starting the separate AI-derived boxes.
      - name: Commit public data and independent latest-news feed
        run: |
          set -e
          git config user.name "evrenexus-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Retry if another workflow updates main between checkout and push.
          for attempt in 1 2 3 4 5; do
            git add data/public/image-health.json data/public/news.json data/public/editorial.json data/public/policy-terms.json data/public/meta.json data/public/latest-news.json data/public/featured.json data/public/important-posts.json data/manual-important-selection.json data/news-ai.json data/reset-editorial-selections.json
            if git diff --cached --quiet; then
              echo "No public-data, latest-news, or image-health changes."
              exit 0
            fi

            git commit -m "Publish rule-based latest news and public data"
            if git push origin HEAD:main; then
              echo "Public data and latest-news feed published successfully."
              exit 0
            fi

            if [ "$attempt" -eq 5 ]; then
              echo "Push failed after 5 attempts."
              exit 1
            fi

            echo "Push race detected; refreshing main and rebuilding generated data (attempt $attempt/5)."
            git fetch origin main
            git reset --hard origin/main
            node scripts/build-latest-news.mjs
            node scripts/validate-latest-news.mjs
            python3 scripts/build_public.py
            node scripts/check-images.mjs
            sleep $((attempt * 3))
          done
      # The following is a separate, non-blocking stage for AI-managed permanent/important articles.
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
