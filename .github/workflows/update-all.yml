name: Evren Nexus — Update All

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: data-writes
  cancel-in-progress: false

jobs:
  update-data:
    name: Update News + TGJU + Nobitex
    runs-on: ubuntu-latest

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Update news
        run: python scripts/news_collector.py

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install market-data dependency
        run: npm install --no-save cheerio@1.0.0-rc.12

      - name: Update TGJU
        run: node market-data/fetch-tgju.js

      - name: Update Nobitex
        run: node market-data/fetch-nobitex.js

      - name: Commit and push updated data
        run: |
          git config user.name "evrenexus-update-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/news.json market-data/tgju.json market-data/nobitex.json

          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi

          git commit -m "Update all Evren Nexus data"

          # Rebase the generated commit onto the latest main.
          # If another commit appeared meanwhile, retry from a fresh checkout.
          for attempt in 1 2 3; do
            git fetch origin main

            if git rebase origin/main; then
              if git push origin HEAD:main; then
                echo "Push succeeded on attempt $attempt."
                exit 0
              fi
            fi

            echo "Push attempt $attempt failed."

            git rebase --abort 2>/dev/null || true

            if [ "$attempt" -lt 3 ]; then
              git reset --hard origin/main

              python scripts/news_collector.py

              node market-data/fetch-tgju.js
              node market-data/fetch-nobitex.js

              git add data/news.json market-data/tgju.json market-data/nobitex.json

              if git diff --cached --quiet; then
                echo "No data changes after refresh."
                exit 0
              fi

              git commit -m "Update all Evren Nexus data"
              sleep 3
            fi
          done

          echo "Could not push after 3 attempts."
          exit 1

  deploy:
    name: Deploy updated site
    needs: update-data
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
