name: Evren Nexus — Update crypto prices

on:
  workflow_dispatch:
    if: ${{ false }}

permissions:
  contents: write

concurrency:
  group: crypto-prices
  cancel-in-progress: true

jobs:
  update:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Fetch LBank USDT prices and timeframes
        run: node market-data/fetch-lbank.js
      - name: Commit changed price data
        run: |
          git config user.name "evrenexus-crypto-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add market-data/lbank.json
          if git diff --cached --quiet; then
            echo "No crypto price changes."
            exit 0
          fi
          git commit -m "Update LBank cryptocurrency prices"
          git push origin HEAD:main
