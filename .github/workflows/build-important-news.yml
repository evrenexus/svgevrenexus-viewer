name: Build important news page

on:
  schedule:
    - cron: "7 */2 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/build_important_news.py"
      - "important-news.html"
      - ".github/workflows/build-important-news.yml"

permissions:
  contents: write

concurrency:
  group: build-important-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AI_PROVIDER: gemini
      GEMINI_API_KEY: \${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select important stories and build data
        run: python scripts/build_important_news.py
      - name: Commit generated important-news data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/important-news.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Refresh rolling important news"
            git push
          fi
