name: Build rolling important news

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run selection without publishing data"
        required: true
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: build-important-news
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      AI_PROVIDER: gemini
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Select and validate important stories
        run: |
          set -e
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/build_important_news.py --dry-run
          else
            python scripts/build_important_news.py
          fi
      - name: Validate generated JSON
        if: inputs.dry_run == false
        run: python -c "import json; d=json.load(open('data/public/important-news.json', encoding='utf-8')); assert d['count'] <= 16; assert len(d['items']) == d['count']; print('JSON valid; count=', d['count'])"
      - name: Commit generated important-news data
        if: inputs.dry_run == false
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/public/important-news.json
          if git diff --cached --quiet; then
            echo "No changes to publish."
          else
            git commit -m "Refresh rolling important news"
            git push
          fi
