<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#f1f2f3;color:#20272d;font-family:Vazir,Tahoma,Arial,sans-serif}
#page{width:850px;max-width:100%;margin:0 auto;padding:148px 10px 25px;display:flex;flex-direction:row;align-items:flex-start;gap:10px;direction:rtl}
#content{width:610px;max-width:610px;min-width:610px;flex:0 0 610px;order:1;overflow:hidden}#sidebar-host{width:200px;min-width:200px;max-width:200px;flex:0 0 200px;order:2}
.topic-head{background:#fff;border:1px solid #dfe2e4;border-top:3px solid #202c35;padding:12px 14px;margin-bottom:12px}.topic-name{font-size:18px;font-weight:700;color:#20272d}.topic-sub{font-size:9px;color:#858c91;margin-top:4px}.section-title{font-size:12px;font-weight:700;color:#202c35;padding:9px 11px;border-bottom:2px solid #d9232e;background:#fff}.news-search{display:flex;gap:6px;background:#fff;border:1px solid #dfe2e4;padding:8px;margin-bottom:12px}.news-search input{flex:1;min-width:0;border:1px solid #e2e5e7;padding:8px 10px;font:10px Vazir,Tahoma,Arial,sans-serif;color:#30373c;outline:0}.news-search input:focus{border-color:#9ca5ab}.news-search button{border:0;background:#202c35;color:#fff;padding:0 14px;font:10px Vazir,Tahoma,Arial,sans-serif;cursor:pointer}.news-tags{background:#fff;border:1px solid #dfe2e4;margin-bottom:12px;padding:9px 10px}.news-tags-title{font-size:10px;font-weight:700;color:#202c35;margin-bottom:7px}.news-tags-list{display:flex;flex-wrap:wrap;gap:5px}.news-tag{border:1px solid #e1e4e6;background:#f7f8f8;color:#596168;padding:4px 8px;font-size:8.5px;text-decoration:none}.news-tag:hover{background:#eef0f1}.search-empty{padding:20px;text-align:center;color:#777;font-size:10px}.Evrenxus-home-footer{width:100%;background:#202c35;color:#fff;margin-top:14px;padding:14px 12px;text-align:center}.Evrenxus-home-footer .footer-tags-title{font-size:10px;font-weight:700;margin-bottom:8px}.Evrenxus-home-footer .news-tags-list{justify-content:center}.Evrenxus-home-footer .news-tag{background:#fff;color:#596168;border-color:#fff}.Evrenxus-manual-update{display:inline-flex;align-items:center;justify-content:center;background:#d9232e;color:#fff;text-decoration:none;font-size:10px;font-weight:700;padding:8px 16px;margin-top:4px;border-radius:2px}.Evrenxus-manual-update:hover{background:#b91d27}.Evrenxus-home-footer .footer-copy{font-size:9px;color:#d7dadd;margin-top:12px;padding-top:9px;border-top:1px solid #3c4850}
#important,#river{width:100%;background:#fff;border:1px solid #dfe2e4;overflow:hidden;margin-bottom:12px}.important-grid{display:block}.important-item{display:flex;gap:10px;padding:11px;text-decoration:none;color:#343b40;background:#fff;border-bottom:1px solid #edf0f1}.important-item:last-child{border-bottom:0}.important-item:hover{background:#fafafa}.important-item img{width:125px;min-width:125px;height:78px;object-fit:cover;background:#eee;display:block}.important-item .important-content{min-width:0;flex:1}.important-title{font-size:11px;font-weight:700;line-height:1.9;color:#20272d}.important-meta{font-size:8.5px;color:#969da2;margin-top:6px}
.item{display:flex;gap:10px;padding:11px;border-bottom:1px solid #edf0f1;text-decoration:none;color:#343b40;background:#fff}.item:hover,.important-item:hover{background:#fafafa}.item img{width:125px;min-width:125px;height:78px;object-fit:cover;background:#eee}.content{min-width:0;flex:1}.title{font-size:11px;font-weight:700;line-height:1.9;color:#20272d}.summary{font-size:9.5px;line-height:1.8;color:#737a7f;margin-top:3px}.meta{font-size:8.5px;color:#969da2;margin-top:6px}.loading,.error{padding:25px;text-align:center;color:#777;font-size:10px}
@media(max-width:700px){html,body{background:#fff;overflow-x:hidden}#page{width:100%;padding:141px 8px 15px;display:block}#content{width:100%;max-width:none}#sidebar-host{width:100%;min-width:0;max-width:none}#Evrenxus-breaking{height:32px;margin-bottom:12px}.Evrenxus-breaking-label{flex-basis:122px;height:32px;font-size:8.5px}.Evrenxus-breaking-track{height:32px}.Evrenxus-breaking-track a{font-size:9px;padding:0 24px}.topic-name{font-size:16px}.important-item{gap:8px;padding:9px}.important-item img{width:105px;min-width:105px;height:66px}.important-title{font-size:10px;line-height:1.85}.important-meta{font-size:8px;margin-top:4px}.important-item .important-content{min-width:0}}
@media(max-width:430px){#page{padding-top:137px}}

@media(max-width:700px){#page{width:100%;max-width:100%;box-sizing:border-box;padding:137px 8px 20px;display:block;overflow-x:hidden}#content{width:100%;max-width:100%;min-width:0;flex:0 0 100%;box-sizing:border-box;overflow:hidden}#sidebar-host{display:block;width:100%;min-width:0;max-width:100%;margin-top:16px}}


.pagination-nav{display:flex;justify-content:center;align-items:center;gap:8px;margin:18px 0 8px;direction:rtl}.pagination-nav button{border:1px solid #dfe2e4;background:#fff;color:#202c35;padding:7px 14px;cursor:pointer;font:10px Vazir,Tahoma,Arial}.pagination-nav button:disabled{opacity:.4;cursor:default}.pagination-nav .page-number{font:10px Vazir,Tahoma,Arial;color:#596168;min-width:60px;text-align:center}
.page-numbers{display:flex;gap:4px;align-items:center}.page-numbers button{border:1px solid #dfe2e4;background:#fff;color:#596168;min-width:26px;height:26px;padding:0 5px;cursor:pointer;font:9px Vazir,Tahoma,Arial}.page-numbers button.active{background:#202c35;color:#fff;border-color:#202c35}</style>
</head>
<body>

<main id="page"><section id="content">
<div class="news-search"><input id="newsSearchInput" type="search" placeholder="جستجو در اخبار..." autocomplete="off"><button id="newsSearchButton" type="button">جستجو</button></div>

<div id="Evrenxus-slider-host"></div>
<section id="river"><div class="section-title">آخرین مطالب</div><div id="list"><div class="loading">در حال دریافت مطالب...</div></div><div id="news-pagination" class="pagination-nav" style="display:none"><button type="button" id="news-prev">صفحه قبلی</button><button type="button" id="news-next">صفحه بعدی</button></div></section>
</section><div id="sidebar-host"></div></main><footer class="Evrenxus-home-footer"><div class="footer-tags-title">برچسب‌های خبری</div><div class="news-tags-list" id="newsTags"></div><div class="footer-copy">© اورین نکسوس</div></footer>
<script src="./Evrenexus-featured.js?v=20261010-06"></script>
<script src="./Evrenexus-slider.js?v=20"></script><script src="./Evrenexus-sidebar.js?v=3"></script>
<script>
(function(){
"use strict";
var q=new URLSearchParams(location.search);
var input=document.getElementById("newsSearchInput"),button=document.getElementById("newsSearchButton"),tags=document.getElementById("newsTags");
var term=(q.get("q")||"").trim();
if(input) input.value=term;
function go(){
 var v=input?input.value.trim():"",u=new URL(location.href);
 if(v)u.searchParams.set("q",v);else u.searchParams.delete("q");
 u.searchParams.delete("page");location.href=u.href;
}
if(button)button.addEventListener("click",go);
if(input)input.addEventListener("keydown",function(e){if(e.key==="Enter")go();});
if(tags){
 fetch("./data/public/news.json?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():null}).then(function(d){
  if(!d||!Array.isArray(d.items))return;
  var names={"economy-investment":"اقتصاد و سرمایه‌گذاری","crypto":"ارزهای دیجیتال","currency-gold":"ارز و طلا","real-estate":"مسکن","technology-ai":"فناوری و هوش مصنوعی",health:"پزشکی و سلامت",auto:"خودرو","science-life":"علم و سبک زندگی"},seen={};
  d.items.forEach(function(x){var ts=Array.isArray(x.topics)?x.topics:[];if(ts.indexOf("economy")!==-1||ts.indexOf("markets")!==-1||ts.indexOf("economy-investment")!==-1)seen["economy-investment"]=true;if(ts.indexOf("crypto")!==-1||/(ارز دیجیتال|رمزارز|رمز ارز|بیت ?کوین|اتریوم|تتر|بایننس|کریپتو|bitcoin|ethereum|crypto|blockchain|solana|ripple|dogecoin|token)/i.test((x.title||"")+" "+(x.summary||"")))seen.crypto=true;ts.forEach(function(t){if(t==="technology"||t==="ai")seen["technology-ai"]=true;else if(names[t])seen[t]=true;});});
  Object.keys(names).forEach(function(t){if(seen[t]){var a=document.createElement("a");a.className="news-tag";a.href="./news-river.html?topic="+encodeURIComponent(t);a.textContent=names[t];tags.appendChild(a);}});
 }).catch(function(){});
}
})();
</script>
<script src="https://evrenexus.github.io/svgevrenexus-viewer/Evrenexus-header.js?v=20261010-02"></script>
</body>
</html>
