<script>
(function(){ "use strict";
var TOPICS={economy:"اقتصادی",markets:"بازار و سرمایه‌گذاری","currency-gold":"ارز و طلا","real-estate":"مسکن",technology:"فناوری",ai:"هوش مصنوعی",health:"پزشکی و سلامت",auto:"خودرو","science-life":"علم و سبک زندگی"};
var q=new URLSearchParams(location.search),topic="all",searchTerm=(q.get("q")||"").trim();

var list=document.getElementById("list"),importantList=document.getElementById("importantList"),editorial={items:{}},aiItems={};
var breakingTrack=document.getElementById("Evrenxus-breaking-track");
function getPermanentArticleId(x){var e=(editorial.items&&editorial.items[x.id])||{};if(e.article_id)return String(e.article_id);var a=aiItems[x.id];if(!a){var ids=Object.keys(aiItems);for(var i=0;i<ids.length;i++){var z=aiItems[ids[i]];if(z&&z.title===x.title){a=z;break}}}return a&&a.article_id?String(a.article_id):""}

function safeDate(value){var d=new Date(value);return Number.isNaN(d.getTime())?null:d}
function makeArticle(a){var x=document.createElement("a");x.className="important-item";x.href="./article.html?id="+encodeURIComponent(a.id);var cc=document.createElement("div");cc.className="important-content";var t=document.createElement("div");t.className="important-title";t.textContent=a.title||"";cc.appendChild(t);var m=document.createElement("div");m.className="important-meta";m.textContent="مطلب اختصاصی Evren Nexus";cc.appendChild(m);x.appendChild(cc);return x}function makeItem(x,important){var a=document.createElement("a");var articleId=important?getPermanentArticleId(x):"";var internal=!!(editorial.items[x.id]&&editorial.items[x.id].republish&&((editorial.items[x.id].content!==undefined)||x.content));var safe=safeUrl(x.url);if(!safe)return null;a.href=articleId?"./article.html?id="+encodeURIComponent(articleId):(internal?"./news-article.html?id="+encodeURIComponent(x.id):"./viewer.html?url="+encodeURIComponent(safe));if(!articleId&&!internal){a.target="_blank";a.rel="noopener noreferrer"}a.className=important?"important-item":"item";
if(x.image){var im=document.createElement("img");im.src=x.image;im.alt=x.title||"";im.loading="lazy";im.referrerPolicy="no-referrer";im.onerror=function(){if(!this.dataset.p){this.dataset.p="1";this.src=proxy(x.image)}else this.remove()};a.appendChild(im)}
var c=document.createElement("div");c.className=important?"important-content":"content";var t=document.createElement("div");t.className=important?"important-title":"title";t.textContent=x.title||"";c.appendChild(t);
if(!important&&x.summary){var s=document.createElement("div");s.className="summary";s.textContent=x.summary;c.appendChild(s)}
var m=document.createElement("div");m.className=important?"important-meta":"meta";var d=safeDate(x.published);m.textContent=(x.source||"")+" • "+(d?d.toLocaleString("fa-IR",{dateStyle:"short",timeStyle:"short"}):"تاریخ نامعتبر");c.appendChild(m);a.appendChild(c);return a}
function render(items){list.innerHTML="";importantList.innerHTML="";if(!items.length){list.innerHTML='<div class="error">فعلاً مطلبی در این موضوع پیدا نشد.</div>';importantList.innerHTML='<div class="error">فعلاً مطلبی در این موضوع پیدا نشد.</div>';renderBreaking([]);return}
var important=(items._important||[]).slice(0,4),breaking=(items._important||[]).slice(0,8),latest=items;
renderBreaking(breaking);
if(important.length){important.forEach(function(x){var el=makeItem(x,true);if(el)importantList.appendChild(el)})}else{importantList.innerHTML='<div class="error">فعلاً خبر مهمی انتخاب نشده است.</div>'};var pageSize=14,page=1,pagination=document.getElementById("news-pagination"),prevBtn=document.getElementById("news-prev"),nextBtn=document.getElementById("news-next"),pageNum=document.getElementById("news-page-number");var pageNumbers=document.getElementById("news-page-numbers");
function renderPage(){var total=Math.max(1,Math.ceil(latest.length/pageSize));if(page>total)page=total;list.innerHTML="";latest.slice((page-1)*pageSize,page*pageSize).forEach(function(x){var el=makeItem(x,false);if(el)list.appendChild(el)});if(pagination){pagination.style.display=total>1?"flex":"none";pageNum.textContent="صفحه "+page+" از "+total;prevBtn.disabled=page<=1;nextBtn.disabled=page>=total;if(pageNumbers){pageNumbers.innerHTML="";var start=Math.max(1,page-3),end=Math.min(total,start+6);start=Math.max(1,end-6);for(var n=start;n<=end;n++){var b=document.createElement("button");b.type="button";b.textContent=n;if(n===page)b.className="active";(function(n){b.onclick=function(){page=n;renderPage();window.scrollTo({top:list.offsetTop-80,behavior:"smooth"})}})(n);pageNumbers.appendChild(b)}}}}
if(prevBtn)prevBtn.onclick=function(){if(page>1){page--;renderPage();window.scrollTo({top:list.offsetTop-80,behavior:"smooth"})}};
if(nextBtn)nextBtn.onclick=function(){if(page<Math.ceil(latest.length/pageSize)){page++;renderPage();window.scrollTo({top:list.offsetTop-80,behavior:"smooth"})}};
renderPage()}
function goSearch(){var value=searchInput.value.trim();var params=new URLSearchParams(location.search);if(value)params.set("q",value);else params.delete("q");location.search=params.toString()}
searchButton.addEventListener("click",goSearch);searchInput.addEventListener("keydown",function(e){if(e.key==="Enter")goSearch()});
function normalizeEditorial(j){
  if(!j||typeof j!=="object"||Array.isArray(j))return {};
  if(j.items!==undefined&&(!j.items||typeof j.items!=="object"||Array.isArray(j.items)))return {};
  return j;
}
fetch("./data/news.json?v="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("news.json HTTP "+r.status);return r.json()}).then(function(data){
return Promise.all([fetch("./data/editorial.json?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():{}}),fetch("./data/news-ai.json?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():{}}),fetch("./data/articles.json?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():{}})]).then(function(ds){return [data,ds[0],ds[1],ds[2]]});
}).then(function(ds){
var data=ds[0],ed=ds[1]||{},ai=ds[2]||{},articlesData=ds[3]||{};editorial=ed;aiItems=ai.items||{};
var aiByTitle={};Object.keys(aiItems).forEach(function(id){var z=aiItems[id];if(z&&z.title)aiByTitle[z.title]=z;});
var edByTitle={};Object.keys(ed.items||{}).forEach(function(id){var z=ed.items[id];if(z&&z.title)edByTitle[z.title]=z;});
function aiFor(x){return aiItems[x.id]||aiByTitle[x.title]||{};}
function edFor(x){return (ed.items&&ed.items[x.id])||edByTitle[x.title]||{};}
var all=(data.items||[]).filter(function(x){
var es=edFor(x),aa=aiFor(x);
return x&&x.title&&x.published&&safeUrl(x.url)&&safeDate(x.published)&&es.deleted!==true&&aa.political!==true&&es.ai_political!==true;
});
all.sort(function(a,b){return safeDate(b.published)-safeDate(a.published)});
var tagCounts={};all.slice(0,120).forEach(function(x){(Array.isArray(x.topics)?x.topics:[]).forEach(function(t){if(TOPICS[t])tagCounts[t]=(tagCounts[t]||0)+1})});Object.keys(tagCounts).sort(function(a,b){return tagCounts[b]-tagCounts[a]}).forEach(function(t){var a=document.createElement("a");a.className="news-tag";a.href="./news-river.html?topic="+encodeURIComponent(t);a.textContent=TOPICS[t];tagsHost.appendChild(a)});
var items=searchTerm?all.filter(function(x){var hay=((x.title||"")+" "+(x.summary||"")+" "+(x.source||"")).toLowerCase();return hay.indexOf(searchTerm.toLowerCase())!==-1}):all;
items.sort(function(a,b){return safeDate(b.published)-safeDate(a.published)});

items._important=importantItems;items._breaking=breakingItems;items._articles=searchTerm?[]:Object.values(articlesData.items||{}).filter(function(a){var e=(ed.items&&ed.items[a.id])||{};return a&&a.status==="published"&&e.deleted!==true});document.querySelector("#river .section-title").textContent=searchTerm?"نتایج جستجو":"تمامی اخبار";render(items)}).catch(function(){list.innerHTML='<div class="error">دریافت خبرها انجام نشد.</div>';importantList.innerHTML='<div class="error">دریافت خبرها انجام نشد.</div>';renderBreaking([])});
})();
