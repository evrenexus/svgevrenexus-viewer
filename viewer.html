#wrapper{

/* =====================================================
   MARKET TICKER
   FIXED
===================================================== */

#Evrenxus-market-tickers{
    width:850px;
    height:25px;

    position:fixed;
    top:0;
    left:50%;

    transform:translateX(-50%);

    z-index:1000;

    overflow:hidden;
}

.Evrenxus-ticker{
    width:100%;
    height:25px;

    display:flex;
    align-items:center;

    background:#10232e;
    color:#fff;

    direction:rtl;

    font-family:Vazir,Tahoma,sans-serif;
    font-size:12px;
    font-weight:bold;
}

.Evrenxus-brand-box{
    width:130px;
    min-width:130px;

    height:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    background:#0c1b24;

    white-space:nowrap;
}

.Evrenxus-brand{
    color:#fff;
    text-decoration:none;

    font-family:Vazir,Tahoma,sans-serif;
    font-size:14px;
    font-weight:bold;
}

.Evrenxus-brand:hover{
    color:#fff;
}

.Evrenxus-datetime{
    width:130px;
    min-width:130px;

    height:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    gap:5px;

    background:#0c1b24;

    white-space:nowrap;

    font-size:11px;
}

.Evrenxus-ticker-window{
    flex:1;

    height:25px;

    overflow:hidden;

    white-space:nowrap;
}

.Evrenxus-ticker-track{
    display:inline-flex;
    align-items:center;

    height:25px;

    white-space:nowrap;

    animation:EvrenxusTickerMove 45s linear infinite;
}

.Evrenxus-ticker-track:hover{
    animation-play-state:paused;
}

.Evrenxus-ticker-item{
    display:inline-flex;
    align-items:center;

    margin-left:28px;

    height:25px;

    white-space:nowrap;
}

.Evrenxus-ticker-item .symbol{
    color:#ddd;
    margin-left:5px;
}

.Evrenxus-ticker-item .price{
    color:#fff;
}

.up{
    color:#70d690;
    margin-right:5px;
}

.down{
    color:#ff8585;
    margin-right:5px;
}

@keyframes EvrenxusTickerMove{

    from{
        transform:translateX(0);
    }

    to{
        transform:translateX(50%);
    }

}


/* =====================================================
   MAIN MENU
   FIXED
===================================================== */

#Evrenxus-main-menu{
    width:850px;
    height:38px;

    position:fixed;
    top:25px;
    left:50%;

    transform:translateX(-50%);

    z-index:999;

    margin:0;
    padding:0;

    background:#fff;

    border-bottom:1px solid #d7d7d7;

    display:flex;
    align-items:center;
    justify-content:center;

    direction:rtl;

    overflow-x:auto;
    overflow-y:hidden;

    white-space:nowrap;

    font-family:Vazir,Tahoma,sans-serif;

    scrollbar-width:none;
}

#Evrenxus-main-menu::-webkit-scrollbar{
    display:none;
}

#Evrenxus-main-menu a{
    height:100%;

    padding:0 13px;

    display:flex;
    align-items:center;
    justify-content:center;

    color:#333;
    text-decoration:none;

    font-size:11.5px;
    font-weight:bold;

    border-left:1px solid #eeeeee;

    white-space:nowrap;

    transition:all .15s ease;
}

#Evrenxus-main-menu a:first-child{
    border-left:none;
}

#Evrenxus-main-menu a:hover{
    color:#147a9c;
    background:#f7f9fa;
}


/* =====================================================
   CONTAINER
===================================================== */

#container{
    margin:0 0 10px;

    /*
     * Ticker: 25px
     * Menu: 38px
     * Search: 35px
     * Gap: 12px
     * Total: 110px
     */

    padding:110px 10px 0;

    overflow:hidden;
}

#content{
    float:right;
    width:610px;
}

#sidebar{
    float:left;
    width:200px;
}


/* =====================================================
   PROPERTY SEARCH
   FIXED HORIZONTAL BAR
===================================================== */

#Evrenxus-property-search{

    width:850px;
    height:35px;

    margin:0;
    padding:0 10px;

    position:fixed;

    top:63px;
    left:50%;

    transform:translateX(-50%);

    z-index:998;

    border:1px solid #d6dde1;
    border-right:4px solid #10232e;

    background:linear-gradient(
        135deg,
        #ffffff 0%,
        #f8fafb 100%
    );

    display:flex;
    align-items:center;

    direction:rtl;

    font-family:Vazir,Tahoma,sans-serif;

    box-shadow:0 2px 7px rgba(0,0,0,.10);
}


/* INFO */

#Evrenxus-property-search-info{

    flex:1;

    min-width:0;

    height:35px;

    display:flex;
    align-items:center;

    gap:10px;

    overflow:hidden;
}


/* TITLE */

#Evrenxus-property-search-title{

    color:#17252d;

    font-size:12px;
    font-weight:bold;

    line-height:35px;

    margin:0;

    white-space:nowrap;

    flex-shrink:0;
}

#Evrenxus-property-search-title a{

    color:#17252d;

    text-decoration:none;
}

#Evrenxus-property-search-title a:hover{

    color:#147a9c;
}


/* HINT */

#Evrenxus-property-search-hint{

    color:#777;

    font-size:9.5px;

    line-height:35px;

    white-space:nowrap;

    overflow:hidden;

    text-overflow:ellipsis;
}


/* FORM */

#Evrenxus-property-search-form{

    display:flex;

    align-items:center;

    gap:5px;

    flex-shrink:0;

    direction:rtl;
}


/* INPUT */

#Evrenxus-property-budget{

    width:85px;
    height:27px;

    padding:0 7px;

    border:1px solid #c8d0d5;

    background:#fff;
    color:#222;

    outline:none;

    border-radius:2px;

    font-family:Vazir,Tahoma,sans-serif;

    font-size:11px;

    text-align:center;
    direction:ltr;

    transition:.15s;
}

#Evrenxus-property-budget::placeholder{

    color:#999;
}

#Evrenxus-property-budget:focus{

    border-color:#147a9c;

    box-shadow:
        0 0 0 2px
        rgba(20,122,156,.10);
}


/* BUTTON */

#Evrenxus-property-search-button{

    height:27px;

    padding:0 13px;

    border:1px solid #10232e;

    border-radius:2px;

    background:#10232e;
    color:#fff;

    font-family:Vazir,Tahoma,sans-serif;

    font-size:11px;
    font-weight:bold;

    cursor:pointer;

    transition:.15s;

    white-space:nowrap;
}

#Evrenxus-property-search-button:hover{

    background:#147a9c;

    border-color:#147a9c;
}


/* ERROR */

#Evrenxus-property-search-error{

    display:none;

    position:absolute;

    right:10px;
    top:36px;

    color:#b23a3a;

    font-family:Vazir,Tahoma,sans-serif;

    font-size:10px;

    white-space:nowrap;
}


/* =====================================================
   SLIDER
===================================================== */

#Evrenxus-slider{

    width:610px;
    height:300px;

    position:relative;

    overflow:hidden;

    margin-bottom:25px;

    background:#222;
}

.Evrenxus-slide{

    display:none;

    width:610px;
    height:300px;

    position:relative;
}

.Evrenxus-slide.active{

    display:block;
}

.Evrenxus-slide img{

    width:610px;
    height:300px;

    object-fit:cover;

    display:block;
}

.Evrenxus-slide-caption{

    position:absolute;

    right:0;
    bottom:0;

    width:100%;

    padding:35px 20px 18px;

    background:linear-gradient(
        transparent,
        rgba(0,0,0,.88)
    );

    color:#fff;

    font-family:Vazir,Tahoma,sans-serif;

    font-size:18px;
    font-weight:bold;
}

.Evrenxus-slider-prev,
.Evrenxus-slider-next{

    position:absolute;

    top:50%;

    transform:translateY(-50%);

    width:38px;
    height:50px;

    border:0;

    background:rgba(0,0,0,.45);

    color:#fff;

    font-size:28px;

    cursor:pointer;

    z-index:10;
}

.Evrenxus-slider-prev{

    left:0;
}

.Evrenxus-slider-next{

    right:0;
}

.Evrenxus-slider-dots{

    position:absolute;

    bottom:8px;
    left:50%;

    transform:translateX(-50%);

    z-index:11;

    display:flex;

    gap:5px;
}

.Evrenxus-slider-dot{

    width:8px;
    height:8px;

    border-radius:50%;

    background:rgba(255,255,255,.5);

    cursor:pointer;
}

.Evrenxus-slider-dot.active{

    background:#fff;
}


/* =====================================================
   ECONOMIC NEWS
===================================================== */

#Evrenxus-economic-box{

    width:610px;

    margin-bottom:25px;

    border:1px solid #d7d7d7;

    background:#fff;

    overflow:hidden;
}

#Evrenxus-economic-grid{

    display:grid;

    grid-template-columns:repeat(2,1fr);

    gap:10px;

    padding:10px;
}

.Evrenxus-economic-card{

    display:flex;

    width:100%;
    height:125px;

    min-width:0;

    border:1px solid #e1e1e1;

    background:#fff;

    color:#222;

    text-decoration:none;

    overflow:hidden;

    direction:rtl;

    transition:.15s;
}

.Evrenxus-economic-card:hover{

    background:#f6f6f6;
    border-color:#bbb;
}

.Evrenxus-economic-image{

    width:115px;
    min-width:115px;

    height:123px;

    object-fit:cover;

    display:block;

    background:#eee;
}

.Evrenxus-economic-content{

    padding:8px 9px;

    overflow:hidden;

    flex:1;
}

.Evrenxus-economic-title{

    font-family:Vazir,Tahoma,sans-serif;

    font-size:12px;
    font-weight:bold;

    line-height:1.7;

    margin-bottom:5px;

    display:-webkit-box;

    -webkit-line-clamp:2;
    -webkit-box-orient:vertical;

    overflow:hidden;
}

.Evrenxus-economic-summary{

    font-family:Vazir,Tahoma,sans-serif;

    font-size:10.5px;

    line-height:1.8;

    color:#666;

    text-align:justify;

    display:-webkit-box;

    -webkit-line-clamp:4;
    -webkit-box-orient:vertical;

    overflow:hidden;
}

.Evrenxus-economic-loading,
.Evrenxus-economic-error{

    grid-column:1 / 3;

    padding:20px;

    text-align:center;

    font-family:Vazir,Tahoma,sans-serif;

    font-size:12px;

    color:#777;
}


/* =====================================================
   BLOG POSTS
===================================================== */

.post{

    margin-bottom:30px;

    margin:0 0 10px;

.blogfa-next{

    text-align:center;

    font-family:Vazir,Tahoma,sans-serif;

    font-size:12px;
}


/* =====================================================
   SIDEBAR
===================================================== */

.menu{

    margin-bottom:15px;

    border:1px solid #ddd;

    background:#fff;

.menu a{

    font-weight:bold;

    border-bottom:0;
}

.Evrenxus-latest-post-item:hover{

    color:#147a9c;

    background:#fafafa;

/* =====================================================
   PAGE MODE
===================================================== */

body.Evrenxus-home .post{

    display:none;
}

body.Evrenxus-home .blogfa-next{

    display:none;
}

body:not(.Evrenxus-home) #Evrenxus-economic-box{

/* =====================================================
   FOOTER
===================================================== */

#footer{

    clear:both;

    padding:15px 10px;

    color:#777;

    color:#555;

    text-decoration:none;
}

<script>

(function(){

    var posts =
        document.querySelectorAll(".post");

    var isDirectPost = false;

    var currentPath =
        window.location.pathname
        .replace(/\/+$/,"");


    for(
        var i = 0;
        i < posts.length;
        i++
    ){

        var link =
            posts[i].querySelector(
                ".post-title a"
            );

        if(!link){
            continue;
        }


        var postPath = "";

        try{

            postPath =
                new URL(
                    link.href,
                    window.location.href
                ).pathname
                .replace(/\/+$/,"");

        }
        catch(e){

            postPath = "";

        }


        if(
            postPath &&
            currentPath === postPath
        ){

            isDirectPost = true;

            break;

        }

    }


    if(!isDirectPost){

        document.body.classList.add(
            "Evrenxus-home"
        );

    }

})();

</script>

     PROPERTY SEARCH SCRIPT
===================================================== -->

<script>

(function(){

    var input =
        document.getElementById(
            "Evrenxus-property-budget"
        );

    var button =
        document.getElementById(
            "Evrenxus-property-search-button"
        );

    var error =
        document.getElementById(
            "Evrenxus-property-search-error"
        );


    function normalizeDigits(value){

        return String(value)

            .replace(/[۰-۹]/g,function(d){

                return "۰۱۲۳۴۵۶۷۸۹".indexOf(d);

            })

            .replace(/[٠-٩]/g,function(d){

                return "٠١٢٣٤٥٦٧٨٩".indexOf(d);

            });

    }


    function searchProperty(){

        var value =
            normalizeDigits(
                input.value
            )
            .replace(/,/g,".")
            .trim();


        var budget =
            Number(value);


        if(
            !value ||
            !isFinite(budget) ||
            budget < 1 ||
            budget > 9999
        ){

            error.style.display =
                "block";

            input.focus();

            return;

        }


        error.style.display =
            "none";


        window.open(
            "https://evrenexus.github.io/avrin-property-advisor/?budget=" +
            encodeURIComponent(budget),
            "_blank"
        );

    }


    button.addEventListener(
        "click",
        searchProperty
    );


    input.addEventListener(
        "keydown",
        function(event){

            if(
                event.key === "Enter"
            ){

                event.preventDefault();

                searchProperty();

            }

        }
    );


    input.addEventListener(
        "input",
        function(){

            error.style.display =
                "none";

        }
    );

})();

</script>


<!-- =====================================================
     GLOBAL MARKETS
===================================================== -->

<script>

(function(){

    var symbols = [

        "XAUUSD",
        "XAGUSD",
        "USOIL",
        "XCUUSD",
        "XPDUSD",
        "DXY",
        "BTCUSD",
        "ETHUSD"

    ];


    var names = {

        XAUUSD:"طلا",
        XAGUSD:"نقره",
        USOIL:"نفت",
        XCUUSD:"مس",
        XPDUSD:"پالادیوم",
        DXY:"شاخص دلار",
        BTCUSD:"بیت‌کوین",
        ETHUSD:"اتریوم"

    };


    var dollarBased = {

        XAUUSD:true,
        XAGUSD:true,
        USOIL:true,
        XCUUSD:true,
        XPDUSD:true,
        DXY:false,
        BTCUSD:true,
        ETHUSD:true

    };


    var track =
        document.getElementById(
            "Evrenxus-global-track"
        );


    function formatPrice(value){

        var number =
            Number(value);


        if(
            !isFinite(number)
        ){

            return "-";

        }


        return new Intl.NumberFormat(
            "en-US",
            {
                minimumFractionDigits:2,
                maximumFractionDigits:2
            }
        ).format(number);

    }


    function createItem(
        symbol,
        data
    ){

        var item =
            document.createElement(
                "span"
            );

        item.className =
            "Evrenxus-ticker-item";


        var price =
            formatPrice(
                data.mid
            );


        var diff =
            Number(
                data.dayDiffPercent
            );


        var direction = "";


        if(
            isFinite(diff)
        ){

            if(diff > 0){

                direction =
                    '<span class="up">▲ ' +
                    diff.toFixed(2) +
                    '%</span>';

            }

            else if(diff < 0){

                direction =
                    '<span class="down">▼ ' +
                    Math.abs(diff).toFixed(2) +
                    '%</span>';

            }

        }


        var pricePrefix =
            dollarBased[symbol]
            ? "$"
            : "";


        item.innerHTML =

            '<span class="symbol">' +
            names[symbol] +
            '</span>' +

            '<span class="price">' +
            pricePrefix +
            price +
            '</span>' +

            direction;


        return item;

    }


    function loadMarkets(){

        var results = [];

        var completed = 0;


        symbols.forEach(

            function(symbol){

                fetch(
                    "https://biquote.io/api/" +
                    symbol
                )

                .then(

                    function(response){

                        if(!response.ok){

                            throw new Error(
                                "HTTP error"
                            );

                        }

                        return response.json();

                    }

                )

                .then(

                    function(data){

                        if(
                            data &&
                            data.mid !== undefined
                        ){

                            results.push({

                                symbol:symbol,
                                data:data

                            });

                        }

                    }

                )

                .catch(

                    function(){}

                )

                .finally(

                    function(){

                        completed++;


                        if(
                            completed ===
                            symbols.length
                        ){

                            if(
                                !results.length
                            ){

                                track.innerHTML =

                                    '<span class="Evrenxus-ticker-item">' +

                                    'دریافت بازارهای جهانی امکان‌پذیر نیست' +

                                    '</span>';

                                return;

                            }


                            track.innerHTML =
                                "";


                            results.forEach(

                                function(result){

                                    track.appendChild(

                                        createItem(
                                            result.symbol,
                                            result.data
                                        )

                                    );

                                }

                            );


                            results.forEach(

                                function(result){

                                    track.appendChild(

                                        createItem(
                                            result.symbol,
                                            result.data
                                        )

                                    );

                                }

                            );

                        }

                    }

                );

            }

        );

    }


    loadMarkets();


    setInterval(
        loadMarkets,
        120000
    );

})();

</script>

<script>

(function(){

    function updateDateTime(){

        var now =
            new Date();


        var shamsi =

            new Intl.DateTimeFormat(

                "fa-IR-u-ca-persian",

                {

                    timeZone:"Asia/Tehran",

                    year:"numeric",

                    month:"long",

                    day:"numeric"

                }

            ).format(now);


        var time =

            new Intl.DateTimeFormat(

                "en-GB",

                {

                    timeZone:"Asia/Tehran",

                    hour:"2-digit",

                    minute:"2-digit",

                    second:"2-digit",

                    hour12:false

                }

            ).format(now);


        document.getElementById(
            "Evrenxus-shamsi"
        ).textContent = shamsi;


        document.getElementById(
            "Evrenxus-time"
        ).textContent = time;

    }


    updateDateTime();


    setInterval(
        updateDateTime,
        1000
    );

})();

</script>
