<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>خبرخوان Evren Nexus</title>
<style>*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;min-height:100%;background:#fff;font-family:Tahoma,Arial,sans-serif}#content{width:100%;height:calc(100vh - 113px);margin-top:113px;position:relative;background:#fff}#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#555;font-size:14px;z-index:1}#iframe{width:100%;height:100%;border:0;display:block;position:relative;z-index:2;background:#fff}@media(max-width:700px){#content{height:calc(100vh - 105px);margin-top:105px}}@media(max-width:430px){#content{height:calc(100vh - 102px);margin-top:102px}}</style>
</head>
<body>

<script src="https://evrenexus.github.io/svgevrenexus-viewer/Evrenexus-header.js"></script>

<div id="content">
<div id="loading">در حال بارگذاری خبر...</div>
<iframe id="iframe" title="خبر"></iframe>
</div>

<script>
(function(){
var params=new URLSearchParams(location.search),newsUrl=params.get("url"),iframe=document.getElementById("iframe"),loading=document.getElementById("loading");
if(!newsUrl){loading.textContent="لینک خبر مشخص نشده است.";return}
try{var url=new URL(newsUrl),allowed=["www.asriran.com","asriran.com","www.donya-e-eqtesad.com","donya-e-eqtesad.com","khabarfarsi.com","www.khabarfarsi.com"];if(allowed.indexOf(url.hostname)===-1){loading.textContent="این منبع در فهرست منابع EVREN NEXUS نیست.";return}if(url.hostname==="khabarfarsi.com"||url.hostname==="www.khabarfarsi.com"){loading.textContent="در حال انتقال به خبر...";window.location.replace(newsUrl);return}iframe.src=newsUrl;iframe.onload=function(){loading.style.display="none"}}catch(e){loading.textContent="آدرس خبر معتبر نیست."}
})();
</script>
</body>
</html>
