<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>خبرخوان Evren Nexus</title>
<style>*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;min-height:100%;background:#fff;font-family:Tahoma,Arial,sans-serif}#content{width:100%;height:calc(100vh - 113px);margin-top:113px;position:relative;background:#fff}#loading{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);color:#555;font-size:14px;z-index:1}#iframe{width:100%;height:100%;border:0;display:block;position:relative;z-index:2;background:#fff}@media(max-width:700px){#content{height:calc(100vh - 105px);margin-top:105px}}@media(max-width:430px){#content{height:calc(100vh - 102px);margin-top:102px}}</style>
</head>
<body>

<script src="https://evrenexus.github.io/svgevrenexus-viewer/Evrenexus-header.js"></script>

<div id="content">
<div id="loading">در حال بارگذاری خبر...</div>
<iframe id="iframe" title="خبر"></iframe>
</div>

<script>
(function(){
var params=new URLSearchParams(location.search),
    newsUrl=params.get("url"),
    iframe=document.getElementById("iframe"),
    loading=document.getElementById("loading");

function show(v){loading.textContent=v}

function resolveKhabarFarsi(url){
    return fetch("https://api.allorigins.win/raw?url="+encodeURIComponent(url),{cache:"no-store"})
    .then(function(r){if(!r.ok)throw new Error("proxy");return r.text()})
    .then(function(html){
        var doc=new DOMParser().parseFromString(html,"text/html");
        var links=[].slice.call(doc.querySelectorAll("a[href]"));
        var candidates=[];
        links.forEach(function(a){
            var href=a.getAttribute("href")||"";
            if(!/^https?:\\/\\//i.test(href))return;
            try{
                var u=new URL(href);
                var h=u.hostname.toLowerCase();
                if(h==="khabarfarsi.com"||h==="www.khabarfarsi.com"||h==="google.com"||h==="www.google.com"||h==="t.me"||h==="telegram.me")return;
                var text=(a.textContent||"").replace(/\\s+/g," ").trim();
                var score=0;
                if(/خبر اصلی|متن کامل|ادامه خبر|منبع|مشاهده/i.test(text))score+=100;
                if(u.pathname.length>8)score+=10;
                candidates.push({url:href,score:score});
            }catch(e){}
        });
        candidates.sort(function(a,b){return b.score-a.score});
        if(candidates.length)return candidates[0].url;
        throw new Error("source not found");
    });
}

function showNews(url){
    iframe.src=url;
    iframe.onload=function(){loading.style.display="none"};
    iframe.onerror=function(){show("امکان نمایش این خبر در خبرخوان وجود ندارد.")};
}

if(!newsUrl){show("لینک خبر مشخص نشده است.");return}

try{
    var url=new URL(newsUrl);
    if(url.hostname==="khabarfarsi.com"||url.hostname==="www.khabarfarsi.com"){
        show("در حال یافتن منبع اصلی خبر...");
        resolveKhabarFarsi(newsUrl).then(function(source){
            showNews(source);
        }).catch(function(){
            show("منبع اصلی خبر پیدا نشد.");
        });
        return;
    }
    if(!/^https?:$/i.test(url.protocol)){
        show("آدرس خبر معتبر نیست.");
        return;
    }
    showNews(newsUrl);
}catch(e){
    show("آدرس خبر معتبر نیست.");
}
})();
</script>
</body>
</html>
