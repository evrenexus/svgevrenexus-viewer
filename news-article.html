<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>خبر | Evren Nexus</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#f1f2f3;color:#20272d;font-family:Vazir,Tahoma,Arial,sans-serif}
#page{width:850px;max-width:100%;margin:0 auto;padding:123px 10px 25px;display:flex;gap:10px;direction:rtl}
#content{width:610px;min-width:610px;overflow:hidden}#sidebar-host{width:200px;min-width:200px}
.article{background:#fff;border:1px solid #dfe2e4;padding:16px}.article-title{font-size:18px;line-height:2;font-weight:700;margin:0 0 8px;color:#20272d}
.article-source-box{display:flex;align-items:center;gap:7px;border:1px solid #d6b900;background:#ffeb00;color:#000;padding:7px 10px;margin:0 0 12px;font-size:10px;line-height:1.8;font-weight:700}
.article-source-box a{color:#000;text-decoration:none;font-weight:700}.article-source-box a:hover{text-decoration:underline}
.ai-republish-warning{background:#f00000;color:#fff;padding:10px 12px;margin:0 0 14px;font-size:10px;line-height:2;font-weight:700;text-align:right;border:1px solid #c40000}
.article-meta{font-size:9px;color:#8a9298;border-bottom:1px solid #edf0f1;padding-bottom:10px;margin-bottom:12px}.article-image{width:100%;max-height:380px;object-fit:cover;display:block;background:#eee;margin:0 0 15px}.article-body{font-size:12px;line-height:2.25;color:#333}.article-body p{margin:0 0 12px}.article-body h2{font-size:18px;margin:18px 0 8px}.article-body h3{font-size:15px;margin:16px 0 7px}.article-body ul,.article-body ol{padding-right:24px}.article-body a{color:#1769aa}.article-body img{max-width:100%;height:auto;display:block;margin:10px auto}.article-source{margin-top:18px;padding-top:10px;border-top:1px solid #e5e7e9;font-size:10px;color:#697177}.article-source a{color:#d9232e;text-decoration:none}.back{display:inline-block;margin-bottom:10px;background:#202c35;color:#fff;text-decoration:none;padding:7px 12px;font-size:9px}
.error{background:#fff;border:1px solid #dfe2e4;padding:25px;text-align:center;font-size:11px;color:#777}
@media(max-width:700px){#page{width:100%;padding:112px 8px 20px;display:block}#content{width:100%;min-width:0}#sidebar-host{display:none}.article{padding:12px}.article-title{font-size:15px}.article-body{font-size:11px;line-height:2.2}.article-image{max-height:280px}}
</style>
</head>
<body>

<main id="page"><section id="content">
<a class="back" href="javascript:history.back()">بازگشت به اخبار</a>
<article class="article" id="article"><div class="error">در حال دریافت خبر...</div></article>
</section><aside id="sidebar-host"></aside></main>
<script src="./Evrenexus-sidebar.js?v=1"></script>
<script>
(function(){
"use strict";
var id=new URLSearchParams(location.search).get("id"),host=document.getElementById("article");
function safeUrl(v){try{var u=new URL(v,location.href);return /^https?:$/i.test(u.protocol)?u.href:""}catch(e){return ""}}
function esc(v){return String(v||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function safeRichHtml(v){
 var box=document.createElement("div"); box.innerHTML=String(v||"");
 var allowed={P:1,BR:1,H2:1,H3:1,STRONG:1,B:1,EM:1,I:1,UL:1,OL:1,LI:1,A:1,IMG:1,BLOCKQUOTE:1};
 Array.from(box.querySelectorAll("*")).forEach(function(el){
   if(!allowed[el.tagName]){el.replaceWith(document.createTextNode(el.textContent||""));return;}
   Array.from(el.attributes).forEach(function(a){
     if((el.tagName==="A"&&a.name==="href")||(el.tagName==="IMG"&&a.name==="src")||(el.tagName==="IMG"&&a.name==="alt"))return;
     el.removeAttribute(a.name);
   });
   if(el.tagName==="A"){
     try{var u=new URL(el.getAttribute("href"),location.href);if(!/^https?:$/i.test(u.protocol))el.removeAttribute("href");else{el.setAttribute("target","_blank");el.setAttribute("rel","noopener noreferrer");}}catch(e){el.removeAttribute("href");}
   }
   if(el.tagName==="IMG"){
     try{var iu=new URL(el.getAttribute("src"),location.href);if(!/^https?:$/i.test(iu.protocol))el.removeAttribute("src");else el.setAttribute("loading","lazy");}catch(e){el.removeAttribute("src");}
   }
 });
 return box.innerHTML.replace(/\n/g,"<br>");
}
function date(v){var d=new Date(v);return Number.isNaN(d.getTime())?"":d.toLocaleString("fa-IR",{dateStyle:"long",timeStyle:"short"})}
function render(x,ed){
var s=ed&&ed.items&&x?ed.items[x.id]:null;
var selected=!!(s&&((s.published===true)||(s.republish===true))&&s.deleted!==true);
var allowed=true;
var edited=!!(s&&s.edited===true);
var data=Object.assign({},x||{});
if(edited){
 if(s.title!==undefined)data.title=s.title;
 if(s.summary!==undefined)data.summary=s.summary;
 if(s.content!==undefined)data.content=s.content;
 if(s.image!==undefined)data.image=s.image;
}
if(!x || !selected || (!allowed && !edited) || !data.content){host.innerHTML='<div class="error">این خبر در نسخه داخلی قابل نمایش نیست.<br><br><a href="'+esc(safeUrl(x&&x.url))+'">مشاهده منبع خبر</a></div>';return}
document.title=(data.title||"خبر")+" | Evren Nexus";
var html='<h1 class="article-title">'+esc(data.title)+'</h1>';
var su=safeUrl(x.url),reader=su?"./viewer.html?url="+encodeURIComponent(su):"";
html+='<div class="article-source-box">منبع خبر: '+esc(x.source||"نامشخص")+(reader?' — <a href="'+esc(reader)+'" target="_blank" rel="noopener noreferrer">مشاهده در خبرخوان Evren Nexus</a>':"")+"</div>";
html+='<div class="ai-republish-warning">این مطلب با کمک هوش مصنوعی از منبع اصلی بازنشر شده است. مسئولیت صحت و سقم محتوا بر عهده منبع اصلی بوده و این صفحه صرفاً بازنشرکننده آن است.</div>';
html+='<div class="article-meta">'+esc(date(data.published||x.published))+'</div>';
if(data.image){var im=safeUrl(data.image);if(im)html+='<img class="article-image" src="'+esc(im)+'" alt="'+esc(data.title)+'" loading="eager" referrerpolicy="no-referrer">'}
html+='<div class="article-body">'+safeRichHtml(data.content||"")+'</div>';
html+='<div class="article-source">منبع: '+esc(x.source||"")+"</div>";
host.innerHTML=html;
}
function normalizeEditorial(j){
  if(!j||typeof j!=="object"||Array.isArray(j))return {};
  if(j.items!==undefined&&(!j.items||typeof j.items!=="object"||Array.isArray(j.items)))return {};
  return j;
}
fetch("./data/news.json?v="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("news.json HTTP "+r.status);return r.json()}).then(function(data){return fetch("./data/editorial.json?v="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("editorial.json HTTP "+r.status);return r.json()}).catch(function(e){console.warn("Editorial data unavailable:",e);return {};}).then(function(editorial){return [data,editorial]});}).then(function(ds){var x=(ds[0].items||[]).find(function(v){return v&&v.id===id});render(x,ds[1]||{})}).catch(function(){host.innerHTML='<div class="error">دریافت خبر انجام نشد.</div>'});
})();
</script>
<script src="https://evrenexus.github.io/svgevrenexus-viewer/Evrenexus-header.js?v=20261005-15"></script>
</body>
</html>
