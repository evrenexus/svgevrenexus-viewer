<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>مطالب مهم | Important Posts | Evren Nexus</title>
<link rel="stylesheet" href="./Evrenexus-site-shell.css?v=3">
<link rel="stylesheet" href="./Evrenexus-home-design.css?v=1">
<style>
/* فقط ظاهر اختصاصی آرشیو؛ چیدمان صفحه از قالب مشترک می‌آید. */
html,body{background:#f3f5f7}
.back{display:inline-block;margin-bottom:10px;background:#142d40;color:#fff;text-decoration:none;padding:7px 12px;font-size:9px}
.archive{background:#fff;border:1px solid #e0e6eb;overflow:hidden}
.head{padding:13px 14px;background:#d64c43;color:#fff}
.head h1{font-size:16px;margin:0}
.head p{font-size:9px;margin:5px 0 0;opacity:.9}
.item{display:flex;gap:10px;padding:11px;border-bottom:1px solid #e8edf1;text-decoration:none;color:#243949;background:#fff}
.item:hover{background:#f8fafb}
.item img{width:125px;min-width:125px;height:78px;object-fit:cover;background:#eee}
.content{min-width:0;flex:1}
.title{font-size:11px;font-weight:700;line-height:1.9;color:#182b3a}
.summary{font-size:9.5px;line-height:1.8;color:#687987;margin-top:3px}
.meta{font-size:8.5px;color:#8b9aa5;margin-top:6px}
.error{padding:25px;text-align:center;color:#777;font-size:10px}
.pagination{display:flex;justify-content:center;align-items:center;gap:8px;padding:13px;border-top:1px solid #e8edf1}
.pagination a{background:#142d40;color:#fff;text-decoration:none;padding:7px 11px;font-size:10px}
.pagination a[aria-disabled="true"]{opacity:.35;pointer-events:none}
.pagination span{font-size:10px;color:#687987}
@media(max-width:700px){.item{gap:8px;padding:9px}.item img{width:105px;min-width:105px;height:66px}.title{font-size:10px}}
</style>
</head>
<body>
<main id="page">
  <section id="content">
    <a class="back" href="./">بازگشت به خانه</a>
    <div class="archive">
      <div class="head"><h1>مطالب مهم</h1></div>
      <div id="list"><div class="error">در حال دریافت مطالب...</div></div>
    </div>
  </section>
  <aside id="sidebar-host"></aside>
</main>
<footer class="Evrenxus-home-footer"><div class="footer-copy">© اورین نکسوس</div></footer>
<script src="./Evrenexus-wordpress-posts.js?v=20261018-01"></script>
<script>
(function(){
"use strict";
var q=new URLSearchParams(location.search),topic=q.get("topic")||"home",page=Math.max(1,parseInt(q.get("page")||"1",10)||1),perPage=21,host=document.getElementById("list");
function img(v){return typeof v==="string"&&/^https?:\/\//i.test(v)?v:""}
function esc(v){return String(v||"").replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function pageUrl(p){var u="./important-archive.html";var args=[];if(topic!=="home")args.push("topic="+encodeURIComponent(topic));if(p>1)args.push("page="+p);return u+(args.length?"?"+args.join("&"):"")}
function articleHref(x){if(x&&x.wordpress&&x.url)return String(x.url);var p=String(x&&x.articleUrl||"").replace(/^\.\//,"");if(/^articles\/[a-zA-Z0-9._-]+\.html$/.test(p))return "./"+p;return "./viewer.html?url="+encodeURIComponent(String(x&&x.url||""));}
function render(doc){
 var section=doc&&doc.topics&&doc.topics[topic]||doc&&doc.topics&&doc.topics.home||{};
 var items=(Array.isArray(section.important)?section.important:[]).filter(function(x){return x&&x.title});
 var seen={};items=items.filter(function(x){var k=String(x.articleId||x.articleUrl||x.id||"");if(!k||seen[k])return false;seen[k]=true;return true});
 items.sort(function(a,b){return String(b.selectedAt||b.published||"").localeCompare(String(a.selectedAt||a.published||""))||Number(b.score||0)-Number(a.score||0)});
 var pages=Math.max(1,Math.ceil(items.length/perPage));page=Math.min(page,pages);
 var visible=items.slice((page-1)*perPage,page*perPage),html="";
 visible.forEach(function(x){
  html+='<a class="item" href="'+articleHref(x).replace(/&/g,"&amp;").replace(/"/g,"&quot;")+'">';
  var u=img(x.image);if(u)html+='<img src="'+u.replace(/"/g,"&quot;")+'" alt="" loading="lazy" referrerpolicy="no-referrer">';
  html+='<div class="content"><div class="title">'+esc(x.title)+'</div>';
  if(x.summary)html+='<div class="summary">'+esc(x.summary)+'</div>';
  html+='<div class="meta">'+esc(x.source||"")+' • '+(x.published?new Date(x.published).toLocaleString("fa-IR",{dateStyle:"short",timeStyle:"short"}):"")+'</div></div></a>';
 });
 if(items.length){html+='<nav class="pagination" aria-label="صفحه‌بندی آرشیو">';html+='<a href="'+pageUrl(Math.max(1,page-1))+'" aria-disabled="'+(page<=1)+'">قبلی</a>';html+='<span>صفحه '+page+' از '+pages+' · '+items.length+' مطلب</span>';html+='<a href="'+pageUrl(Math.min(pages,page+1))+'" aria-disabled="'+(page>=pages)+'">بعدی</a></nav>'}
 host.innerHTML=html||'<div class="error">هنوز مطلب مهمی در آرشیو ثبت نشده است.</div>';
}
function loadLegacyArchive(){
 Promise.all([
 fetch("./data/editorial.json?v="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("editorial HTTP "+r.status);return r.json()}),
 fetch("./data/news.json?v="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw Error("news HTTP "+r.status);return r.json()})
]).then(function(parts){
 var ed=parts[0]&&parts[0].items||{},raw=parts[1],news=Array.isArray(raw)?raw:(Array.isArray(raw.items)?raw.items:(Array.isArray(raw.news)?raw.news:[])),byId={};
 news.forEach(function(n){if(n&&n.id!=null)byId[String(n.id)]=n});
 var manual=Object.keys(ed).map(function(id){
  var s=ed[id]||{},n=byId[String(id)]||{},path=String(s.article_url||"");
  if(s.manual_important!==true||s.deleted===true)return null;
  return {id:String(id),articleId:String(id),articleUrl:path,url:String(n.url||""),title:s.title||n.title||"",summary:s.summary||n.summary||"",image:img(s.image||n.image||""),source:n.source||"Evren Nexus",published:n.published||s.updated_at||"",selectedAt:s.updated_at||n.published||"",topics:s.topics_manual===true&&Array.isArray(s.topics)?s.topics:(Array.isArray(n.topics)?n.topics:[])};
 }).filter(function(x){return x&&x.title});
 var topics={home:{important:manual}};
 ["economy-investment","crypto","currency-gold","real-estate","auto","technology-ai","health","science-life"].forEach(function(t){
  topics[t]={important:manual.filter(function(x){var a=x.topics||[];if(t==="economy-investment")return a.indexOf("economy")>=0||a.indexOf("markets")>=0||a.indexOf(t)>=0;if(t==="technology-ai")return a.indexOf("technology")>=0||a.indexOf("ai")>=0||a.indexOf(t)>=0;return a.indexOf(t)>=0})};
 });
 render({topics:topics});
}).catch(function(){host.innerHTML='<div class="error">دریافت آرشیو مطالب مهم انجام نشد؛ مطالب حذف نشده‌اند.</div>'});
}
function matchesTopic(x){
 if(topic==="home")return true;
 var ts=Array.isArray(x.topics)?x.topics:[];
 if(topic==="economy-investment")return ts.indexOf("economy")>=0||ts.indexOf("markets")>=0||ts.indexOf(topic)>=0;
 if(topic==="technology-ai")return ts.indexOf("technology")>=0||ts.indexOf("ai")>=0||ts.indexOf(topic)>=0;
 if(topic==="crypto")return ts.indexOf("crypto")>=0;
 return ts.indexOf(topic)>=0;
}
function renderWordPress(posts){
 var items=(Array.isArray(posts)?posts:[]).filter(matchesTopic).map(function(x){
  return {id:x.id,articleId:x.id,wordpress:true,articleUrl:"",url:x.url,title:x.title,summary:x.summary,image:x.image,source:x.source,published:x.published,selectedAt:x.published,topics:x.topics||[]};
 });
 var data={topics:{}};data.topics[topic]={important:items};data.topics.home={important:topic==="home"?items:(Array.isArray(posts)?posts:[]).map(function(x){return{id:x.id,articleId:x.id,wordpress:true,url:x.url,title:x.title,summary:x.summary,image:x.image,source:x.source,published:x.published,selectedAt:x.published,topics:x.topics||[]};})};
 render(data);
}
if(window.EvrenWordPress&&typeof window.EvrenWordPress.getPosts==="function"){
 window.EvrenWordPress.getPosts(true).then(renderWordPress).catch(function(error){console.warn("WordPress important archive unavailable:",error);host.innerHTML='<div class="error">دریافت مطالب وردپرس انجام نشد.</div>';});
}else{host.innerHTML='<div class="error">اتصال به وردپرس در دسترس نیست.</div>';}

})();
</script>
<script src="./Evrenexus-sidebar.js?v=20261018-02"></script><script src="./Evrenexus-important-posts.js?v=20261018-02"></script>
<script src="./Evrenexus-header.js?v=20261011-04"></script>
</body>
</html>
