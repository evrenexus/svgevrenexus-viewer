<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evren Nexus — تست تصاویر دنیای اقتصاد</title>
<style>
body{font-family:Tahoma,Arial,sans-serif;background:#f1f2f3;margin:0;padding:30px;color:#20272d}
.wrap{max-width:700px;margin:auto;background:#fff;padding:20px}
.item{display:block;padding:15px 0;border-bottom:1px solid #ddd;color:#222;text-decoration:none}
.item img{display:block;width:100%;max-width:610px;height:180px;object-fit:cover;margin-bottom:10px;background:#eee}
.status{padding:10px;background:#eee;margin-bottom:15px;font-size:13px}
</style>
</head>
<body><div class="wrap"><h2>آزمایش تصاویر دنیای اقتصاد</h2>
<div id="status" class="status">در حال دریافت RSS...</div><div id="list"></div></div>
<script>
const feeds=["https://donya-e-eqtesad.com/feeds/","https://donya-e-eqtesad.com/fa/feeds/?p=all"];
const list=document.getElementById("list"),status=document.getElementById("status");
function clean(v){const d=document.createElement("div");d.innerHTML=v||"";return(d.textContent||"").trim()}
function proxy(u){return"https://images.weserv.nl/?url="+encodeURIComponent(u)}
function imageFrom(x){let v=x.thumbnail||x.mediaThumbnail||"";if(v)return v;let h=x.content||x["content:encoded"]||x.description||"";let d=document.createElement("div");d.innerHTML=h;let i=d.querySelector("img");if(i)return i.getAttribute("src")||i.getAttribute("data-src")||i.getAttribute("data-original")||"";return""}
function rss(u){return new Promise((ok,no)=>{let c="cb"+Date.now()+Math.random().toString(36).slice(2),s=document.createElement("script");window[c]=d=>{delete window[c];s.remove();d&&d.items&&d.items.length?ok(d.items):no()};s.onerror=()=>{delete window[c];s.remove();no()};s.src="https://api.rss2json.com/v1/api.json?callback="+c+"&rss_url="+encodeURIComponent(u)+"&count=10";document.head.appendChild(s)})}
(async()=>{for(const f of feeds){try{const items=await rss(f);status.textContent="RSS موفق: "+f+" | "+items.length+" مطلب";items.forEach(x=>{let a=document.createElement("a");a.className="item";a.href=x.link||"#";a.target="_blank";let im=imageFrom(x);if(im){let i=document.createElement("img");i.src=im;i.referrerPolicy="no-referrer";i.onerror=()=>{if(!i.dataset.p){i.dataset.p="1";i.src=proxy(im)}else i.remove()};a.appendChild(i)}let t=document.createElement("div");t.textContent=clean(x.title);a.appendChild(t);list.appendChild(a)});return}catch(e){}}status.textContent="RSS دریافت نشد یا تصویر در RSS موجود نیست."})()
</script></body></html>
