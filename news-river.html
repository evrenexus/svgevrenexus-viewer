<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>اخبار</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;background:#f1f2f3;color:#20272d;font-family:Vazir,Tahoma,Arial,sans-serif}
#page{width:850px;max-width:100%;margin:0 auto;padding:123px 10px 25px;display:flex;flex-direction:row;align-items:flex-start;gap:10px;direction:rtl}
#content{width:610px;max-width:610px;min-width:610px;flex:0 0 610px;order:1;overflow:hidden}#sidebar-host{width:200px;min-width:200px;max-width:200px;flex:0 0 200px;order:2}
#Evrenxus-breaking{width:100%;height:34px;margin:0 0 14px;display:flex;align-items:center;background:#202c35;color:#fff;overflow:hidden}.Evrenxus-breaking-label{flex:0 0 150px;height:34px;display:flex;align-items:center;justify-content:center;background:#17232d;font-size:10px;font-weight:700;border-left:1px solid #34434d;direction:rtl}.Evrenxus-breaking-track{height:34px;flex:1;min-width:0;overflow:hidden;display:flex;align-items:center;white-space:nowrap}.Evrenxus-breaking-ticker{display:flex;flex:0 0 max-content;align-items:center;white-space:nowrap;animation:EvrenxusBreakingMove 42s linear infinite;will-change:transform}.Evrenxus-breaking-group{display:flex;flex:0 0 max-content;align-items:center;white-space:nowrap}.Evrenxus-breaking-track a{display:inline-block;flex:0 0 auto;padding:0 30px;color:#fff;font-size:10px;text-decoration:none;}.Evrenxus-breaking-track a:hover{color:#ffb3b3}@keyframes EvrenxusBreakingMove{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.topic-head{background:#fff;border:1px solid #dfe2e4;border-top:3px solid #202c35;padding:12px 14px;margin-bottom:12px}.topic-name{font-size:18px;font-weight:700;color:#20272d}.topic-sub{font-size:9px;color:#858c91;margin-top:4px}.section-title{font-size:12px;font-weight:700;color:#202c35;padding:9px 11px;border-bottom:2px solid #d9232e;background:#fff}.news-search{display:flex;gap:6px;background:#fff;border:1px solid #dfe2e4;padding:8px;margin-bottom:12px}.news-search input{flex:1;min-width:0;border:1px solid #e2e5e7;padding:8px 10px;font:10px Vazir,Tahoma,Arial,sans-serif;color:#30373c;outline:0}.news-search input:focus{border-color:#9ca5ab}.news-search button{border:0;background:#202c35;color:#fff;padding:0 14px;font:10px Vazir,Tahoma,Arial,sans-serif;cursor:pointer}.news-tags{background:#fff;border:1px solid #dfe2e4;margin-bottom:12px;padding:9px 10px}.news-tags-title{font-size:10px;font-weight:700;color:#202c35;margin-bottom:7px}.news-tags-list{display:flex;flex-wrap:wrap;gap:5px}.news-tag{border:1px solid #e1e4e6;background:#f7f8f8;color:#596168;padding:4px 8px;font-size:8.5px;text-decoration:none}.news-tag:hover{background:#eef0f1}.search-empty{padding:20px;text-align:center;color:#777;font-size:10px}
#important,#river{width:100%;background:#fff;border:1px solid #dfe2e4;overflow:hidden;margin-bottom:12px}.important-grid{display:block}.important-item{display:flex;gap:10px;padding:11px;text-decoration:none;color:#343b40;background:#fff;border-bottom:1px solid #edf0f1}.important-item:last-child{border-bottom:0}.important-item:hover{background:#fafafa}.important-item img{width:125px;min-width:125px;height:78px;object-fit:cover;background:#eee;display:block}.important-item .important-content{min-width:0;flex:1}.important-title{font-size:11px;font-weight:700;line-height:1.9;color:#20272d}.important-meta{font-size:8.5px;color:#969da2;margin-top:6px}
.item{display:flex;gap:10px;padding:11px;border-bottom:1px solid #edf0f1;text-decoration:none;color:#343b40;background:#fff}.item:hover,.important-item:hover{background:#fafafa}.item img{width:125px;min-width:125px;height:78px;object-fit:cover;background:#eee}.content{min-width:0;flex:1}.title{font-size:11px;font-weight:700;line-height:1.9;color:#20272d}.summary{font-size:9.5px;line-height:1.8;color:#737a7f;margin-top:3px}.meta{font-size:8.5px;color:#969da2;margin-top:6px}.loading,.error{padding:25px;text-align:center;color:#777;font-size:10px}
@media(max-width:700px){html,body{background:#fff;overflow-x:hidden}#page{width:100%;padding:116px 8px 15px;display:block}#content{width:100%;max-width:none}#sidebar-host{width:100%;min-width:0;max-width:none}#Evrenxus-breaking{height:32px;margin-bottom:12px}.Evrenxus-breaking-label{flex-basis:122px;height:32px;font-size:8.5px}.Evrenxus-breaking-track{height:32px}.Evrenxus-breaking-track a{font-size:9px;padding:0 24px}.topic-name{font-size:16px}.important-item{gap:8px;padding:9px}.important-item img{width:105px;min-width:105px;height:66px}.important-title{font-size:10px;line-height:1.85}.important-meta{font-size:8px;margin-top:4px}.important-item .important-content{min-width:0}}
@media(max-width:430px){#page{padding-top:112px}}
.Evrenxus-page-footer{width:100%;padding:12px;text-align:center;font:9px Tahoma,Arial,sans-serif;color:#777;border-top:1px solid #e5e7e9;background:#fff} .Evrenxus-home-footer{width:100%;background:#202c35;color:#fff;margin-top:14px;padding:14px 12px;text-align:center}.Evrenxus-home-footer .footer-tags-title{font-size:10px;font-weight:700;margin-bottom:8px}.Evrenxus-home-footer .news-tags-list{justify-content:center}.Evrenxus-home-footer .news-tag{background:#fff;color:#596168;border-color:#fff}.Evrenxus-home-footer .footer-copy{font-size:9px;color:#d7dadd;margin-top:12px;padding-top:9px;border-top:1px solid #3c4850}
@media(max-width:700px){#page{width:100%;max-width:100%;box-sizing:border-box;padding:112px 8px 20px;display:block;overflow-x:hidden}#content{width:100%;max-width:100%;min-width:0;flex:0 0 100%;box-sizing:border-box;overflow:hidden}#sidebar-host{display:none}}

.Evrenxus-refresh-icon{float:left;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;color:#fff;text-decoration:none;font-size:15px;font-weight:700;line-height:1;border:1px solid rgba(255,255,255,.45);border-radius:2px}.Evrenxus-refresh-icon:hover{background:rgba(255,255,255,.14)}
</style></html>
</head>
<body>
<script src="./Evrenexus-header.js"></script>
<main id="page"><section id="content">
<div id="Evrenxus-breaking"><div class="Evrenxus-breaking-label"><span id="Evrenxus-live-date"></span><span>&nbsp; | &nbsp;</span><span id="Evrenxus-live-time"></span></div><div class="Evrenxus-breaking-track" id="Evrenxus-breaking-track"><span>در حال دریافت مهم‌ترین اخبار...</span></div></div>
<div class="news-search"><input id="newsSearchInput" type="search" placeholder="جستجوی اخبار..." autocomplete="off"><button id="newsSearchButton" type="button">جستجو</button></div>
<section id="important"><div class="section-title" id="importantTitle" style="background:#d9232e;color:#fff;border-bottom:0"><a class="Evrenxus-refresh-icon" href="./manual-update.html" target="_blank" rel="noopener noreferrer" title="به‌روزرسانی">↻</a>مهم‌ترین اخبار</div><div id="importantList" class="important-grid"><div class="loading">در حال دریافت مطالب...</div></div></section>
<div id="Evrenxus-slider-host"></div>
<section id="river"><div class="section-title">جدیدترین اخبار</div><div id="list"><div class="loading">در حال دریافت مطالب...</div></div></section>
</section><div id="sidebar-host"></div></main><footer class="Evrenxus-home-footer"><div class="footer-tags-title">برچسب‌های خبری</div><div class="news-tags-list" id="newsTags"></div><div class="footer-copy">© اورین نکسوس</div></footer>
<script src="./Evrenexus-slider.js?v=3"></script><script src="./Evrenexus-sidebar.js?v=1"></script>
<script>
(function(){ "use strict";
var TOPICS={economy:"اقتصادی",markets:"بازار و سرمایه‌گذاری","currency-gold":"ارز و طلا","real-estate":"مسکن",technology:"فناوری",ai:"هوش مصنوعی",health:"پزشکی و سلامت",auto:"خودرو","science-life":"علم و سبک زندگی"};
var q=new URLSearchParams(location.search),topic=q.get("topic")||"economy",searchTerm=(q.get("q")||"").trim();if(!TOPICS[topic])topic="economy";
var searchInput=document.getElementById("newsSearchInput"),searchButton=document.getElementById("newsSearchButton"),tagsHost=document.getElementById("newsTags"),importantTitle=document.getElementById("importantTitle");
searchInput.value=searchTerm;
var topicLabel=TOPICS[topic];
importantTitle.innerHTML='<a class="Evrenxus-refresh-icon" href="./manual-update.html" target="_blank" rel="noopener noreferrer" title="به‌روزرسانی">↻</a>مهم‌ترین اخبار '+topicLabel;
searchInput.placeholder="جستجوی اخبار "+topicLabel;
document.title=searchTerm?"نتایج جستجو":TOPICS[topic];
var list=document.getElementById("list"),importantList=document.getElementById("importantList");
var breakingTrack=document.getElementById("Evrenxus-breaking-track");
function updateClock(){var n=new Date();document.getElementById("Evrenxus-live-date").textContent=new Intl.DateTimeFormat("fa-IR-u-ca-persian",{timeZone:"Asia/Tehran",year:"numeric",month:"2-digit",day:"2-digit"}).format(n);document.getElementById("Evrenxus-live-time").textContent=new Intl.DateTimeFormat("en-GB",{timeZone:"Asia/Tehran",hour:"2-digit",minute:"2-digit",second:"2-digit",hour12:false}).format(n)}
updateClock();setInterval(updateClock,1000);
function renderBreaking(items){breakingTrack.innerHTML="";if(!items.length){breakingTrack.innerHTML="<span>مهم‌ترین اخبار در دسترس نیست</span>";return}var ticker=document.createElement("div");ticker.className="Evrenxus-breaking-ticker";var group=document.createElement("div");group.className="Evrenxus-breaking-group";items.forEach(function(x){var a=document.createElement("a");var safe=safeUrl(x.url);if(!safe)return; a.href="./viewer.html?url="+encodeURIComponent(safe);a.target="_blank";a.rel="noopener noreferrer";a.textContent=x.title||"";group.appendChild(a)});var clone=group.cloneNode(true);ticker.appendChild(group);ticker.appendChild(clone);breakingTrack.appendChild(ticker);}
function proxy(v){return v?"https://images.weserv.nl/?url="+encodeURIComponent(v):""}
function safeUrl(value){try{var u=new URL(value,location.href);return /^https?:$/i.test(u.protocol)?u.href:""}catch(e){return ""}}
function safeDate(value){var d=new Date(value);return Number.isNaN(d.getTime())?null:d}
function makeItem(x,important){var a=document.createElement("a");var safe=safeUrl(x.url);if(!safe)return null;a.href="./viewer.html?url="+encodeURIComponent(safe);a.target="_blank";a.rel="noopener noreferrer";a.className=important?"important-item":"item";
if(x.image){var im=document.createElement("img");im.src=x.image;im.alt=x.title||"";im.loading="lazy";im.referrerPolicy="no-referrer";im.onerror=function(){if(!this.dataset.p){this.dataset.p="1";this.src=proxy(x.image)}else this.remove()};a.appendChild(im)}
var c=document.createElement("div");c.className=important?"important-content":"content";var t=document.createElement("div");t.className=important?"important-title":"title";t.textContent=x.title||"";c.appendChild(t);
if(x.summary){var s=document.createElement("div");s.className="summary";s.textContent=x.summary;c.appendChild(s)}
var m=document.createElement("div");m.className=important?"important-meta":"meta";var d=safeDate(x.published);m.textContent=(x.source||"")+" • "+(d?d.toLocaleString("fa-IR",{dateStyle:"short",timeStyle:"short"}):"تاریخ نامعتبر");c.appendChild(m);a.appendChild(c);return a}
function render(items){list.innerHTML="";importantList.innerHTML="";if(!items.length){list.innerHTML='<div class="error">فعلاً مطلبی در این موضوع پیدا نشد.</div>';importantList.innerHTML='<div class="error">فعلاً مطلبی در این موضوع پیدا نشد.</div>';renderBreaking([]);return}
var important=items.slice(0,4),latest=items.slice(0,100);renderBreaking(important);important.forEach(function(x){var el=makeItem(x,true);if(el)importantList.appendChild(el)});latest.forEach(function(x){var el=makeItem(x,false);if(el)list.appendChild(el)})}
function goSearch(){var value=searchInput.value.trim();var params=new URLSearchParams(location.search);if(value)params.set("q",value);else params.delete("q");location.search=params.toString()}
searchButton.addEventListener("click",goSearch);searchInput.addEventListener("keydown",function(e){if(e.key==="Enter")goSearch()});
fetch("./data/news.json?v="+Date.now(),{cache:"no-store"}).then(function(r){if(!r.ok)throw Error();return r.json()}).then(function(data){var all=(data.items||[]).filter(function(x){return x&&x.title&&x.published&&safeUrl(x.url)&&safeDate(x.published)});all.sort(function(a,b){return safeDate(b.published)-safeDate(a.published)});
var tagCounts={};all.slice(0,120).forEach(function(x){(Array.isArray(x.topics)?x.topics:[]).forEach(function(t){if(TOPICS[t])tagCounts[t]=(tagCounts[t]||0)+1})});Object.keys(tagCounts).sort(function(a,b){return tagCounts[b]-tagCounts[a]}).forEach(function(t){var a=document.createElement("a");a.className="news-tag";a.href="?topic="+encodeURIComponent(t);a.textContent=TOPICS[t];tagsHost.appendChild(a)});
var items=searchTerm?all.filter(function(x){var hay=((x.title||"")+" "+(x.summary||"")+" "+(x.source||"")).toLowerCase();return hay.indexOf(searchTerm.toLowerCase())!==-1}):all.filter(function(x){return Array.isArray(x.topics)&&x.topics.indexOf(topic)!==-1});
items.sort(function(a,b){return safeDate(b.published)-safeDate(a.published)});document.querySelector("#river .section-title").textContent=searchTerm?"نتایج جستجو":"جدیدترین اخبار";render(items)}).catch(function(){list.innerHTML='<div class="error">دریافت خبرها انجام نشد.</div>';importantList.innerHTML='<div class="error">دریافت خبرها انجام نشد.</div>';renderBreaking([])});
})();
</script>
</body>
<style>
