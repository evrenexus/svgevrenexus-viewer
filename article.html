<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>مطلب | Evren Nexus</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f1f2f3;color:#20272d;font-family:Tahoma,Arial,sans-serif}
#page{width:850px;max-width:100%;margin:auto;padding:123px 10px 25px;display:flex;gap:10px;direction:rtl}
#content{width:610px;min-width:0;background:#fff;border:1px solid #dfe2e4;padding:18px}
#sidebar-host{width:200px}
.back{display:inline-block;margin-bottom:14px;background:#202c35;color:#fff;text-decoration:none;padding:7px 12px;font-size:10px}
h1{font-size:21px;line-height:1.9;margin:0 0 8px;color:#20272d}
.meta{font-size:9px;color:#8a9196;margin-bottom:15px;border-bottom:1px solid #edf0f1;padding-bottom:10px}
.article-image{width:100%;max-height:360px;object-fit:cover;display:block;margin:0 0 16px;background:#eee}.summary{font-size:11px;line-height:2;color:#596168;background:#f7f8f8;border-right:3px solid #d9232e;padding:10px;margin-bottom:18px}.ai-notice{background:#c91520;color:#fff;padding:11px 13px;margin:0 0 18px;font-size:10px;line-height:2.15;border-radius:2px}.ai-notice strong{font-weight:bold}.ai-notice a{color:#fff;text-decoration:underline}
.article-body{font-size:12px;line-height:2.25;color:#30383e}
.article-body h2{font-size:15px;margin:20px 0 8px;border-bottom:1px solid #e5e7e9;padding-bottom:5px}
.article-body p{margin:0 0 13px}.article-body ul{padding-right:22px}.article-body li{margin-bottom:6px}
.sources{margin-top:22px;padding-top:12px;border-top:1px solid #dfe2e4;font-size:9px;color:#697177}
.sources a{color:#b51f29;text-decoration:none}
@media(max-width:700px){#page{display:block;width:100%;padding:112px 8px 20px}#content{width:100%;padding:13px}#sidebar-host{display:none}h1{font-size:17px}.article-body{font-size:11px;line-height:2.2}}
</style></head>
<body>

<main id="page"><section id="content"><a class="back" href="./">بازگشت به خانه</a><article id="article">در حال دریافت مطلب...</article></section><aside id="sidebar-host"></aside></main>
<script src="./Evrenexus-sidebar.js?v=1"></script>
<script>
(function(){
"use strict";
var id=new URLSearchParams(location.search).get("id"),host=document.getElementById("article");
function esc(v){return String(v||"").replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]})}
function safeUrl(v){try{var u=new URL(v,location.href);return /^https?:$/i.test(u.protocol)?u.href:""}catch(e){return""}}
function rich(v){var box=document.createElement("div");box.innerHTML=String(v||"");var ok={P:1,BR:1,H2:1,UL:1,OL:1,LI:1,STRONG:1,B:1,EM:1,I:1,A:1};Array.from(box.querySelectorAll("*")).forEach(function(el){if(!ok[el.tagName]){el.replaceWith(document.createTextNode(el.textContent||""));return}Array.from(el.attributes).forEach(function(a){if(el.tagName==="A"&&a.name==="href")return;el.removeAttribute(a.name)});if(el.tagName==="A"){var u=safeUrl(el.getAttribute("href"));if(!u)el.removeAttribute("href");else{el.setAttribute("href",u);el.setAttribute("target","_blank");el.setAttribute("rel","noopener noreferrer")}}});return box.innerHTML}
function sourceOf(a){var s=a&&a.sources&&a.sources[0];return safeUrl((s&&s.url)||a.url||"")}
function cleanBody(v){
 var box=document.createElement("div");box.innerHTML=String(v||"");
 box.querySelectorAll("script,style,iframe,nav,footer,header,form,button").forEach(function(x){x.remove()});
 box.querySelectorAll("br").forEach(function(x){x.replaceWith(document.createTextNode("\\n"))});
 box.querySelectorAll("p,div,h1,h2,h3,li").forEach(function(x){x.appendChild(document.createTextNode("\\n"))});
 var raw=(box.textContent||"").replace(/\\u00a0/g," ").replace(/\\r/g,"").replace(/[ \\t]+/g," ").replace(/\\n{3,}/g,"\\n\\n").trim();
 raw=raw.replace(/(?:^|\\n)\\s*(?:کد خبر\\s*[:：]?\\s*\\d+|https?:\\/\\/\\S+|h\\s*ps:\\/\\/\\S+|شنبه\\s+\\d+.*?\\d{2}:\\d{2})\\s*(?=\\n|$)/gim,"\\n");
 var seen=new Set(),paras=[];
 raw.split(/\\n+/).map(function(x){return x.trim()}).filter(Boolean).forEach(function(p){
   var parts=p.split(/(?<=[.!؟])\\s+/),kept=[];
   parts.forEach(function(s){s=s.trim();var k=s.replace(/[\\s\\p{P}\\p{S}]/gu,"");if(k.length<18||!seen.has(k)){kept.push(s);if(k.length>=18)seen.add(k)}});
   var value=kept.join(" ").trim(),key=value.replace(/[\\s\\p{P}\\p{S}]/gu,"");
   if(value&&(!key||!seen.has("P:"+key))){paras.push(value);if(key)seen.add("P:"+key)}
 });
 return paras.join("\\n\\n");
}
function render(a){
 if(!a){host.innerHTML="<h1>مطلب پیدا نشد</h1>";return}
 var title=String(a.title||"مطلب").trim(),summary=String(a.summary||"").trim(),sourceUrl=sourceOf(a);
 var body=cleanBody(a.content),continuation="جهت مطالعه متن کامل‌تر اینجا کلیک کنید";
 var budget=4000-title.length-summary.length-2;
 var truncated=body.length>budget;
 if(truncated){
   var linkReserve=sourceUrl?continuation.length+3:1;
   body=body.slice(0,Math.max(0,budget-linkReserve)).trim().replace(/\\s+\\S*$/,"").trim()+"…";
   if(sourceUrl)body+="\\n\\n"+continuation;
 }
 document.title=title+" | Evren Nexus";
 var html="<h1>"+esc(title)+"</h1>";
 if(a.image&&safeUrl(a.image))html+="<img class='article-image' src='"+esc(safeUrl(a.image))+"' alt='"+esc(title)+"' loading='eager' referrerpolicy='no-referrer'>";
 html+="<div class='ai-notice'>این متن توسط هوش مصنوعی و بدون دخالت انسان از منبع اصلی بازنویسی و خلاصه‌نویسی شده و می‌تواند دارای خطا یا اشتباهاتی باشد.";
 if(sourceUrl)html+=" برای مشاهده متن اصلی و کامل‌تر <a href='./viewer.html?url="+encodeURIComponent(sourceUrl)+"' target='_blank' rel='noopener noreferrer'>روی این لینک کلیک کنید</a>.";
 html+="</div>";
 html+="<div class='meta'>Evren Nexus • "+esc(new Date(a.updated_at||a.published_at).toLocaleString("fa-IR"))+"</div>";
 if(summary)html+="<div class='summary'>"+esc(summary)+"</div>";
 var parts=body.split("\\n\\n"),bodyHtml=parts.map(function(p){if(p===continuation&&sourceUrl)return "<p><a href='./viewer.html?url="+encodeURIComponent(sourceUrl)+"' target='_blank' rel='noopener noreferrer'>"+esc(continuation)+"</a></p>";return p?"<p>"+esc(p)+"</p>":""}).join("");
 html+="<div class='article-body'>"+bodyHtml+"</div>";
 host.innerHTML=html;
}
function entries(d){if(!d)return[];if(Array.isArray(d))return d;var v=d.items||d.articles||d;return Array.isArray(v)?v:Object.keys(v).map(function(k){var x=v[k]||{};x.__key=k;return x})}
function resolveArticle(articleDoc,editorialDoc,newsDoc){
 var as=entries(articleDoc), es=entries(editorialDoc), ns=entries(newsDoc), all=as.concat(ns);
 var a=as.find(function(x){return String(x.id||"")===String(id)||String(x.slug||"")===String(id)||String(x.__key||"")===String(id)||String(x.article_id||"")===String(id)});
 if(a)return a;
 var e=es.find(function(x){return String(x.article_id||"")===String(id)||String(x.id||"")===String(id)||String(x.__key||"")===String(id)});
 if(e){
   var n=all.find(function(x){return String(x.id||"")===String(e.__key||"")||String(x.id||"")===String(e.original_news_id||"")});
   return {id:id,title:e.title||(n&&n.title)||"",summary:e.summary||(n&&n.summary)||"",content:e.content||e.article_content||"",image:e.image||(n&&n.image)||"",published_at:e.published_at||(n&&n.published)||"",updated_at:e.updated_at||e.published_at||(n&&n.published)||"",sources:e.sources||(n&&n.source?[{name:n.source,url:n.url||""}]:[])};
 }
 var n=all.find(function(x){return String(x.id||"")===String(id)||String(x.article_id||"")===String(id)||String(x.__key||"")===String(id)});
 if(n)return {id:id,title:n.title||"",summary:n.summary||"",content:n.content||"",image:n.image||"",published_at:n.published||n.published_at||"",updated_at:n.updated_at||n.published||"",sources:n.sources||(n.source?[{name:n.source,url:n.url||""}]:[])};
 return null;
}
Promise.all([
 fetch("./data/articles.json?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():{}}).catch(function(){return {}}),
 fetch("./data/editorial.json?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():{}}).catch(function(){return {}}),
 fetch("./data/news.json?v="+Date.now(),{cache:"no-store"}).then(function(r){return r.ok?r.json():{}}).catch(function(){return {}})
]).then(function(parts){render(resolveArticle(parts[0],parts[1],parts[2]))}).catch(function(){host.innerHTML="<h1>دریافت مطلب انجام نشد.</h1>"});
})();
</script><script src="https://evrenexus.github.io/svgevrenexus-viewer/Evrenexus-header.js?v=20261005-15"></script>
</body></html>
