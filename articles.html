<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مطالب ویژه | Evren Nexus</title>
<style>body{margin:0;background:#f1f2f3;font-family:Tahoma,Arial;color:#20272d}main{width:610px;max-width:calc(100% - 20px);margin:123px auto 25px}.head{background:#202c35;color:#fff;padding:12px;font-weight:bold}.item{display:block;background:#fff;border:1px solid #dfe2e4;border-top:0;padding:13px;text-decoration:none;color:#20272d}.title{font-size:13px;font-weight:bold;line-height:1.9}.meta{font-size:9px;color:#8a9196;margin-top:5px}.summary{font-size:10px;color:#697177;line-height:1.8;margin-top:5px}</style></head>
<body><script src="./Evrenexus-header.js?v=20261005-3"></script><main><div class="head">مطالب ویژه Evren Nexus</div><div id="list">در حال دریافت...</div></main>
<script>(function(){var h=document.getElementById("list");fetch("./data/articles.json?v="+Date.now(),{cache:"no-store"}).then(r=>r.json()).then(d=>{var a=Object.values(d.items||{}).filter(x=>x&&x.status==="published").sort((a,b)=>new Date(b.updated_at)-new Date(a.updated_at));h.innerHTML="";a.forEach(function(x){var e=document.createElement("a");e.className="item";e.href="./article.html?id="+encodeURIComponent(x.id);e.innerHTML="<div class='title'></div><div class='meta'></div><div class='summary'></div>";e.querySelector(".title").textContent=x.title||"";e.querySelector(".meta").textContent=new Date(x.updated_at||x.published_at).toLocaleString("fa-IR");e.querySelector(".summary").textContent=x.summary||"";h.appendChild(e)})}).catch(function(){h.textContent="دریافت مطالب انجام نشد."})})();</script></body></html>
